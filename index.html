/* =========================== 大廳選單 ===========================
   走過去按確認鍵打開的兩個畫面：
     levels —— 關卡目錄（所有關卡一覽，含施工中的；最後一張是「關閉」）
     stats  —— 戰績詳情（逐關卡勝負 ＋ 玩最多 ＋ 最近玩過）
   刻意做成 DOM 覆蓋層而不是 3D：加關卡只要加一筆資料，
   完全不用碰 3D、不用重算取景、不用煩惱門放哪裡。
   ============================================================== */
let menu = null;                      // null = 沒開；{ kind:'levels'|'stats', sel:int }

const menuEl = $('menu'), menuCard = $('menuCard');
const hx = (c) => '#' + c.toString(16).padStart(6, '0');

/** 關卡的主色（目錄卡片與戰績表共用） */
const gameColor = (id) => GAME_COLORS[id] || 0x9ad8ff;

/** 目錄的卡片清單。遊戲之外的東西（例如動態門）不放進來。 */
const MENU_ORDER = ['duel2048', 'duelVolley', 'duelFight', 'duelOX', 'duelFruit', 'duelSplat', 'duelTug', 'duelRace', 'duelMemory', 'duelMath'];
function menuTiles() {
  const t = [];
  // 第一張固定是「再玩一次」—— 原本這是北牆一道動態門的功能，
  // 改成目錄裡的第一張卡片，不用先走到某道特定的門，反而更好找。
  const last = lastPlayed();
  if (last && MINIGAMES[last]) {
    t.push({ kind:'game', id:last, ready:true, color:gameColor(last),
             label:'🔁 再玩一次：' + MINIGAMES[last].label });
  }
  for (const id of MENU_ORDER) {
    const d = MINIGAMES[id];
    if (!d) continue;
    t.push({ kind: 'game', id, label: d.label, ready: !!d.ready, color: gameColor(id) });
  }
  t.push({ kind: 'party', label: '🎲 隨機派對（5 局）', ready: true, color: 0x9ad8ff });
  t.push({ kind: 'close', label: '關閉', color: 0xff9a9a });
  return t;
}

function openMenu(kind) {
  menu = { kind, sel: 0 };
  menuEl.classList.add('on');
  $('hud').style.display = 'none';
  blip(kind === 'levels' ? 660 : 520, 0.09, 0.07);
  menuRender();
}
function closeMenu() {
  menu = null;
  menuEl.classList.remove('on');
  $('hud').style.display = '';
  blip(300, 0.08, 0.05);
}

function menuRender() {
  if (!menu) return;
  const tiles = menuTiles();

  if (menu.kind === 'levels') {
    menu.sel = Math.max(0, Math.min(tiles.length - 1, menu.sel));
    const cards = tiles.map((t, i) => {
      const mc = hx(t.color);
      let st;
      if (t.kind === 'close') st = '回到大廳';
      else if (t.kind === 'party') st = '隨機抽 5 個關卡連續玩，比總勝場';
      else {
        const b = rec.byGame[t.id] || { p1: 0, p2: 0, draw: 0 };
        const plays = b.p1 + b.p2 + b.draw;
        st = t.ready
          ? (plays ? `玩過 <b>${plays}</b> 場　·　P1 ${b.p1}　P2 ${b.p2}　平 ${b.draw}`
                   : '還沒玩過')
          : '🔒 施工中';
      }
      return `<div class="mtile${t.kind === 'close' ? ' close' : ''}${i === menu.sel ? ' sel' : ''}${t.ready === false ? ' lock' : ''}"
                   style="--mc:${mc}">
                <div class="nm" style="color:${mc}">${t.label}</div>
                <div class="st">${st}</div>
              </div>`;
    }).join('');
    menuCard.innerHTML =
      `<h2>🎮 關卡目錄</h2><p class="sub">選一個關卡開始　·　共 ${MENU_ORDER.length} 個關卡</p>
       <div class="mgrid">${cards}</div>
       <div class="mft">方向鍵／WASD 選擇　·　確認鍵進入　·　Esc 或選「關閉」返回</div>`;
    return;
  }

  /* ---- 戰績詳情 ---- */
  const rows = MENU_ORDER.filter(id => MINIGAMES[id]).map(id => {
    const b = rec.byGame[id] || { p1: 0, p2: 0, draw: 0 };
    const plays = b.p1 + b.p2 + b.draw;
    return `<tr><td style="color:${hx(gameColor(id))}">${MINIGAMES[id].label}</td>
                <td>${plays}</td><td>${b.p1}</td><td>${b.p2}</td><td>${b.draw}</td></tr>`;
  }).join('');

  const mp = mostPlayed();
  const recent = (rec.recent || []).filter(id => MINIGAMES[id]);
  menuCard.innerHTML =
    `<h2>📊 戰績詳情</h2><p class="sub">總場次 <b>${rec.games || 0}</b>　·　
       平手 <b>${rec.draw || 0}</b>　·　被變身 <b>${rec.pig[0]} : ${rec.pig[1]}</b>（P1 : P2）</p>
     <table class="mt">
       <tr><th>關卡</th><th>場次</th><th>P1 勝</th><th>P2 勝</th><th>平手</th></tr>
       ${rows}
     </table>
     <div class="msec">🏆 玩最多的關卡　<b>${mp ? MINIGAMES[mp.id].label + '（' + mp.n + ' 場）' : '還沒有紀錄'}</b></div>
     <div class="msec">🕘 最近玩過　${recent.length
        ? recent.map((id, i) => `<span class="pill" style="color:${hx(gameColor(id))}">${i + 1}. ${MINIGAMES[id].label}</span>`).join('')
        : '還沒有紀錄'}</div>
     <div class="mft">Esc 或按確認鍵返回大廳</div>`;
}

/** 選單裡的按鍵：兩個玩家都能操作（跟門一樣，誰都可以按） */
const MENU_DIRKEY = [
  { up: 'w', down: 's', left: 'a', right: 'd' },
  { up: 'arrowup', down: 'arrowdown', left: 'arrowleft', right: 'arrowright' },
];
function menuInput() {
  for (let i = 0; i < 2; i++) {
    for (const d of ['up', 'down', 'left', 'right'])
      if (PRESSED[MENU_DIRKEY[i][d]] || padPressed(i, PADB[d])) return d;
    if (PRESSED['space'] || PRESSED['enter'] || padPressed(i, 0)) return 'ok';
    if (PRESSED['escape'] || padPressed(i, 1)) return 'back';
  }
  return null;
}

function menuStep() {
  if (!menu) return;
  const a = menuInput();
  if (!a) return;
  if (a === 'back') { closeMenu(); return; }
  if (a === 'ok') {
    if (menu.kind === 'stats') { closeMenu(); return; }   // 詳情只有一個動作：返回
    const t = menuTiles()[menu.sel];
    if (!t) return;
    if (t.kind === 'close') { closeMenu(); return; }
    if (t.kind === 'party') { closeMenu(); startParty(5); return; }
    if (!t.ready) { blip(170, 0.12, 0.07); return; }      // 施工中 → 拒絕音
    closeMenu();
    startMinigame(t.id);
    return;
  }
  // 方向：3 欄的格子，上下移動一列
  const n = menuTiles().length;
  if (n <= 1) return;
  const cols = 3;
  let s = menu.sel;
  if (a === 'left')  s -= 1;
  if (a === 'right') s += 1;
  if (a === 'up')    s -= cols;
  if (a === 'down')  s += cols;
  const next = Math.max(0, Math.min(n - 1, s));
  if (next !== menu.sel) { menu.sel = next; blip(880, 0.04, 0.04); menuRender(); }
}

/* =========================== 隨機派對 ===========================
   隨機抽 N 個關卡連續玩，累計勝場，最後比總勝場。 */
let party = null;   // { total, played, wins:[0,0], queue:[] }

function startParty(n) {
  const ids = MENU_ORDER.filter(id => MINIGAMES[id] && MINIGAMES[id].ready);
  const pool = [...ids];
  const queue = [];
  for (let i = 0; i < n; i++) {
    if (pool.length === 0) pool.push(...ids);
    const j = (rng() * pool.length) | 0;
    queue.push(pool.splice(j, 1)[0]);
  }
  party = { total: n, played: 0, wins: [0, 0], queue };
  startMinigame(queue[0]);
}

/* =========================== 主流程 =========================== */
function startMinigame(id) {
  const def = MINIGAMES[id];
  if (!def || !def.ready) {
    tip(`「${def ? def.label : id}」施工中`, '這個門後面還沒做好——門就是選單，做好直接掛上去', true);
    return;
  }
  currentGameId = id;                            // 戰績要記「哪一關」，存起來給 endMinigame 用
  activeGame = def.create();
  const sceneGame = !!activeGame.ownsScene;      // 3D 小遊戲（戰鬥）要看到場景本身
  $('mini').classList.toggle('scene', sceneGame);
  $('miniStage').style.display = sceneGame ? 'none' : '';
  renderer.domElement.style.filter = sceneGame ? '' : 'blur(3px) brightness(.45)';
  activeGame.mount();
  $('hud').style.display = 'none';          // 大廳說明在 3D 小遊戲裡會穿幫
  currentHint = def.hint || '請用 <b>WASD</b>（P1）／<b>方向鍵</b>（P2）開始';
  $('miniBottom').innerHTML = currentHint;
  phase = PHASE.COUNT; phaseT = 3.2; phaseStart = performance.now();
  audio();  // 使用者手勢後解鎖音效
}

function endMinigame() {
  const s = activeGame.scores();
  const [a, c] = s;
  lastResult = {
    scores: s,
    detail: activeGame.detail ? activeGame.detail() : '',
    winner: a === c ? -1 : (a > c ? 0 : 1),
    gameId: currentGameId,                       // 逐關卡戰績用
  };
  // 先抽好要變哪一種頭 —— 這樣 RESULT 畫面寫的跟真正變的會是同一隻。
  // 抽的時候排除「輸家現在已經戴著的頭」，所以連輸兩場一定看得出換了動物。
  if (party) {
    // 隨機派對：只累計勝場、不變身（連續玩，最後回大廳才結算）
    if (lastResult.winner >= 0) party.wins[lastResult.winner]++;
    party.played++;
    lastResult.head = null;
  } else if (lastResult.winner >= 0) {
    const loserIdx = lastResult.winner === 0 ? 1 : 0;
    lastResult.head = randomHead(players[loserIdx].headKind);
  } else {
    lastResult.head = null;                        // 平手：沒人變身
  }
  phase = PHASE.RESULT; phaseT = 0;
}

function backToLobby() {
  if (activeGame) { activeGame.unmount(); activeGame = null; }
  renderer.domElement.style.filter = '';
  $('mini').classList.remove('scene');
  $('miniStage').style.display = '';
  $('hud').style.display = '';
  $('miniBottom').innerHTML = '';

  resetToSpawn();                          // 兩個小人歸回原位
  lobbyLockUntil = performance.now() + 700; // 剛回大廳先關掉門的觸發（避免按著鍵連開）

  if (lastResult) {
    const w = lastResult.winner;
    recordResult(w, lastResult.gameId);   // 記進 localStorage ＋ 更新記分板與動態門
    if (w >= 0) {
      const loser = w === 0 ? 1 : 0;
      setHead(players[w], null);             // ✅ 贏的人立刻變回來
      // 輸的人：每次都要變成「結果畫面公告的那一隻」—— 即使已經是一隻動物也照換。
      // 這裡原本寫成 if (!players[loser].headKind)（已經變身中就維持），
      // 但 endMinigame 早就把公告的頭抽好了 → 變成「公告說恐龍頭、實際還是豬頭」。
      const kind = lastResult.head || randomHead(players[loser].headKind);
      setHead(players[loser], kind);
      if (kind === 'pig') pigSqueal();       // 豬還是有豬叫，其他先只給一個提示音
      else { blip(720, 0.08, 0.09); blip(330, 0.22, 0.08); }
    }
  }
  phase = PHASE.LOBBY; phaseT = 0;
}

/* ---- 門的接近判定與提示 ---- */
const doorTip = $('doorTip');
let nearDoor = null;
let lobbyLockUntil = 0;      // 剛回大廳的緩衝期，期間不觸發門
function checkDoors() {
  if (phase !== PHASE.LOBBY) { doorTip.style.display = 'none'; nearDoor = null; return; }
  let found = null;
  players.forEach((p, i) => {
    if (found) return;
    for (const d of DOORS) {
      if (Math.hypot(p.group.position.x - d.sx, p.group.position.z - d.sz) < 2.0) {
        d.by = i; found = d; break;
      }
    }
  });
  nearDoor = found;
}
function tip(main, sub, warn, color) {
  doorTip.innerHTML = `${main}<div class="sub">${sub || ''}</div>`;
  doorTip.classList.toggle('warn', !!warn);
  if (color) {
    doorTip.style.setProperty('--tipc', '#' + color.toString(16).padStart(6, '0'));
    doorTip.style.setProperty('--tipglow',
      `rgba(${(color >> 16) & 255},${(color >> 8) & 255},${color & 255},.34)`);
  }
  doorTip.style.display = 'block';
}

/* ---- 站點（更衣鏡／重置鈕）的接近判定 ---- */
let nearStation = null, resetArmedUntil = 0, resetFlashUntil = 0;
function checkStations() {
  if (phase !== PHASE.LOBBY) { nearStation = null; return; }
  let found = null;
  players.forEach((p, i) => {
    if (found) return;
    const px = p.group.position.x, pz = p.group.position.z;
    if (Math.hypot(px - MIRROR.x, pz - MIRROR.z) < MIRROR.r)      found = { kind:'mirror', by:i };
    else if (Math.hypot(px - STATS.x,  pz - STATS.z)  < STATS.r)  found = { kind:'stats',  by:i };
    else if (Math.hypot(px - RESETP.x, pz - RESETP.z) < RESETP.r) found = { kind:'reset',  by:i };
  });
  nearStation = found;
}

/* ---- 倒數 ---- */
const countEl = $('count');
const COUNT_SECONDS = 3;
function updateCount(now) {
  // 用「真實時間」而不是被上限截斷的 dt ——
  // 否則分頁被瀏覽器節流時，dt 一直被截在 0.05，倒數會比實際慢幾十倍。
  const remain = COUNT_SECONDS - (now - phaseStart) / 1000;
  if (remain > 0.2) { countEl.textContent = Math.ceil(remain); countEl.classList.add('on'); }
  else { countEl.textContent = 'GO'; countEl.classList.add('on'); }
  if (remain <= 0) {
    countEl.classList.remove('on');
    phase = PHASE.PLAY; phaseT = 0;
    $('miniBottom').innerHTML = currentHint;
  }
}

/* ---- 主迴圈 ---- */
const DIRMAP = { up:'up', down:'down', left:'left', right:'right' };
let last = performance.now(), frames = 0, fpsT = 0, fps = 0;

function frame(now) {
  try {
    frameBody(now);
  } catch (err) {
    frame.errCount = (frame.errCount || 0) + 1;
    errBox.textContent = 'ERROR: ' + ((err && err.message) || err) + '\n' + ((err && err.stack) || '');
    errBox.style.display = 'block';
    if (frame.errCount > 300) return;      // 避免無限洗版
  }
  // 不論上面發生什麼，這兩個一定要執行 —— 否則整個遊戲會「完全不會動」
  outlineTick();                     // 依目前相機補償描邊粗細
  renderer.render(scene, activeCam);
  requestAnimationFrame(frame);
}

function frameBody(now) {
  const dt = Math.min((now - last) / 1000, 0.05);
  last = now;
  frames++; fpsT += dt;
  if (fpsT >= 0.5) { fps = Math.round(frames / fpsT); frames = 0; fpsT = 0; }

  // 3D 小遊戲（戰鬥）自己控制角色 —— 大廳邏輯必須讓開，
  // 否則戰鬥中的角色會被大廳的移動與桌子碰撞拉走。
  const sceneGame = activeGame && activeGame.ownsScene;
  // 選單打開時：小人站著不動，也不判定門／站點（不然會一直被觸發）
  if (phase !== PHASE.COUNT && !sceneGame && !menu) stepLobby(dt);

  // 豬頭計時
  // 變身沒有計時器：要贏一場（或按重置戰績）才會變回來，所以這裡不需要任何處理。

  if (menu) { nearDoor = null; nearStation = null; }
  else { checkDoors(); checkStations(); }

  // 門燈呼吸：靠近的那扇跳得特別明顯
  {
    const tt = now / 1000;
    for (const d of DOORS) {
      const hot = nearDoor === d && phase === PHASE.LOBBY;
      d.lamp.scale.setScalar(hot ? 1.35 + Math.sin(tt * 9) * 0.24 : 1 + Math.sin(tt * 2.0) * 0.06);
    }
    if (RESETP.mesh)
      RESETP.mesh.material.emissiveIntensity =
        performance.now() < resetArmedUntil ? 1.7 + Math.sin(now / 90) * 0.8 : 0.9;
  }

  if (phase === PHASE.LOBBY) {
    const key = (i) => (i === 0 ? 'Space' : 'Enter');

    if (menu) {
      doorTip.style.display = 'none';
      menuStep();                            // 選單開著時，只處理選單的按鍵
    } else if (performance.now() < lobbyLockUntil) {
      doorTip.style.display = 'none';        // 緩衝中：不顯示提示也不觸發
    } else if (nearDoor) {
      if (!nearDoor.ready) {
        tip(`⛔ 「${nearDoor.label}」施工中`, '走到門前按確認，但這個門後面還沒做好', true);
      } else {
        tip(`🚪 ${nearDoor.label}`,
            nearDoor.opensMenu
              ? `P1 按 Space ／ P2 按 Enter ／ 手把 A 開啟　·　共 ${MENU_ORDER.length} 個關卡`
              : 'P1 按 Space ／ P2 按 Enter ／ 手把 A 進入',
            false, nearDoor.color);
        // 一定要用「邊緣觸發」（confirmEdge），不能用 confirm（按住狀態）。
        // 用按住狀態的話：站在門前按確認開目錄 → 在目錄裡按「關閉」回到大廳
        // → 手還按著／人還站在門前 → 同一幀又立刻把目錄打開，看起來就是「卡住」。
        for (let i = 0; i < 2; i++)
          if (PLAYER_CTRL[i].confirmEdge()) {
            if (nearDoor.opensMenu) openMenu(nearDoor.opensMenu);
            else startMinigame(doorTarget(nearDoor));
            break;
          }
      }
    } else if (nearStation) {
      const st = nearStation, i = st.by, nm = PLAYER_CTRL[i].name;

      if (st.kind === 'mirror') {
        const p = players[i];
        if (p.headKind) {
          // 輸掉變成動物期間不准換造型 —— 不然懲罰就被鏡子洗掉了
          tip(`🪞 更衣鏡　（${nm}）`,
              '🚫 變身中不能換造型　·　贏一場才能變回來', true, 0xffb454);
          if (PLAYER_CTRL[i].confirmEdge()) blip(170, 0.12, 0.07);   // 拒絕音
        } else {
          tip(`🪞 更衣鏡　（${nm}）`,
              `按 ${key(i)} 切換造型　·　目前：${BODIES[looks[i]].label}`, false, 0x9ad8ff);
          if (PLAYER_CTRL[i].confirmEdge()) setBody(i, looks[i] + 1);
        }

      } else if (st.kind === 'dir') {
        tip('🎮 關卡目錄', `按 ${key(i)} 開啟　·　目前 ${MENU_ORDER.length} 個關卡`, false, 0x9ad8ff);
        if (PLAYER_CTRL[i].confirmEdge()) openMenu('levels');

      } else if (st.kind === 'stats') {
        tip('📊 戰績詳情', `按 ${key(i)} 開啟　·　總場次 ${rec.games || 0}`, false, 0x9ad8ff);
        if (PLAYER_CTRL[i].confirmEdge()) openMenu('stats');

      } else if (performance.now() < resetFlashUntil) {
        tip('✅ 戰績已重置', '記分板已歸零', false, 0x66dd99);

      } else {
        const armed = performance.now() < resetArmedUntil;
        tip('⚠️ 重置全部戰績',
            armed ? '再按一次確認（3 秒內）' : `按 ${key(i)} 開始　·　會清空記分板上的所有數字`, true);
        if (PLAYER_CTRL[i].confirmEdge()) {
          if (armed) { resetRec(); resetArmedUntil = 0; resetFlashUntil = performance.now() + 1600; blip(300, 0.28, 0.1); }
          else       { resetArmedUntil = performance.now() + 3000; blip(880, 0.1, 0.08); }
        }
      }
    } else doorTip.style.display = 'none';
  }

  if (phase === PHASE.COUNT) updateCount(now);

  if (phase === PHASE.PLAY && activeGame) {
        for (let i = 0; i < 2; i++) {
      const kb = i === 0
        ? { up:'w', down:'s', left:'a', right:'d' }
        : { up:'arrowup', down:'arrowdown', left:'arrowleft', right:'arrowright' };
      const h = HELD[i];
      h.up = !!KEYS[kb.up]; h.down = !!KEYS[kb.down];
      h.left = !!KEYS[kb.left]; h.right = !!KEYS[kb.right];
      const ax = padAxis(i);
      if (ax.x < -0.4) h.left = true;  if (ax.x > 0.4) h.right = true;
      if (ax.z < -0.4) h.up = true;    if (ax.z > 0.4) h.down = true;
      for (const d of ['up', 'down', 'left', 'right']) if (padHeld(i, PADB[d])) h[d] = true;

      // 邊緣觸發（給「一格一動」的遊戲用，例如 2048）
      for (const d of ['up', 'down', 'left', 'right']) {
        if (PRESSED[kb[d]]) { activeGame.onDir(i, d); PRESSED[kb[d]] = false; }
      }
      for (const d of ['up', 'down', 'left', 'right']) {
        if (padPressed(i, PADB[d])) activeGame.onDir(i, d);
      }
      // 確認鍵（邊緣觸發）—— 給需要「選取／放下」的遊戲用，例如移動圈叉。
      // 2048 與排球不需要，所以它們沒有定義 onConfirm，不會受影響。
      if (activeGame.onConfirm && PLAYER_CTRL[i].confirmEdge()) activeGame.onConfirm(i);
    }
    if (activeGame.onHold) activeGame.onHold(HELD);
    if (activeGame.update) activeGame.update(dt);
    if (activeGame.allDead()) endMinigame();
  }

  if (phase === PHASE.RESULT) {
    const s = activeGame ? activeGame.scores() : lastResult.scores;
    const w = s[0] === s[1] ? -1 : (s[0] > s[1] ? 0 : 1);
    const who = w === -1 ? '平手！' : (w === 0 ? 'P1 紅　勝' : 'P2 藍　勝');
    const hd = (lastResult && lastResult.head) ? HEADS[lastResult.head] : null;
    const loserTxt = (w === -1 || !hd) ? '平手，沒有人要變身'
      : `${w === 0 ? 'P2 藍' : 'P1 紅'} 要被變成 ${hd.emoji} ${hd.label}`;
    const detail = (activeGame && activeGame.detail ? activeGame.detail() : null)
                || (lastResult && lastResult.detail) || '';
    if (party) {
      const done = party.played >= party.total;
      const champ = party.wins[0] === party.wins[1] ? '平手'
        : (party.wins[0] > party.wins[1] ? '🏆 P1 紅 總勝' : '🏆 P2 藍 總勝');
      $('miniBottom').innerHTML =
        `<span class="big">${who}</span>` + detail +
        `<br>總比分　P1 <b>${party.wins[0]}</b> : <b>${party.wins[1]}</b> P2　（第 ${party.played}/${party.total} 局）` +
        (done ? `<br><span class="big">${champ}！</span><br><span style="opacity:.7">按確認回到大廳</span>`
              : `<br><span style="opacity:.7">按確認進下一局</span>`);
    } else {
      $('miniBottom').innerHTML =
        `<span class="big">${who}</span>` + detail +
        `${loserTxt}<br><span style="opacity:.7">按 P1 Space 或 P2 Enter 回到大廳</span>`;
    }
    if (PLAYER_CTRL[0].confirm() || PLAYER_CTRL[1].confirm()) {
      if (party && party.played < party.total) startMinigame(party.queue[party.played]);
      else { backToLobby(); party = null; }
    }
  }

  for (const k in PRESSED) PRESSED[k] = false;

  probe.textContent = `fps ${fps} | ${phase} | P1(${players[0].group.position.x.toFixed(1)},${players[0].group.position.z.toFixed(1)}) P2(${players[1].group.position.x.toFixed(1)},${players[1].group.position.z.toFixed(1)})`;
}
const probe = $('probe');

addEventListener('resize', () => {
  fitCamera();
  renderer.setSize(innerWidth, innerHeight);
});

/* ---------- 觸屏虛擬按鍵 ---------- */
function setupTouch() {
  const isTouch = ('ontouchstart' in window) || (navigator.maxTouchPoints > 0);
  if (!isTouch) return;
  $('touchControls').classList.add('on');
  document.querySelectorAll('#touchControls [data-k]').forEach(btn => {
    const k = btn.dataset.k;
    const down = (e) => { e.preventDefault(); e.stopPropagation(); if (!KEYS[k]) PRESSED[k] = true; KEYS[k] = true; };
    const up = () => { KEYS[k] = false; };
    btn.addEventListener('touchstart', down, { passive: false });
    btn.addEventListener('touchend', up);
    btn.addEventListener('touchcancel', up);
  });
}
setupTouch();

renderer.render(scene, activeCam);
requestAnimationFrame(frame);

/* ---- 給自動測試用 ---- */
window.__party = {
  ready:true,
  phase: () => phase,
  enter: (id) => startMinigame(id),
  engine: { gEmpty, gSpawn, gSlideLine, gLines, gMove, gCanMove, gNew, gStep },
  three: THREE.REVISION,
  /* 效能監控：draw call / 三角形 / 紋理數量。直接讀 renderer 的統計，不是估算值。 */
  info: () => ({ render: { ...renderer.info.render }, memory: { ...renderer.info.memory },
                 programs: renderer.info.programs ? renderer.info.programs.length : -1 }),
  // --- 除錯用 ---
  press: (k) => { KEYS[k] = true; PRESSED[k] = true; },
  release: (k) => { KEYS[k] = false; },
  forceEnd: () => { if (activeGame) endMinigame(); },
  // --- 大廳新功能 ---
  record: () => JSON.parse(JSON.stringify(rec)),
  resetRecord: () => resetRec(),
  looks: () => looks.slice(),
  setBody: (i, b) => setBody(i, b),
  near: () => (nearStation ? { ...nearStation } : (nearDoor ? { kind:'door', label:nearDoor.label, menu:nearDoor.opensMenu || null, by:nearDoor.by } : null)),
  run: () => players.map((p, i) => ({ i,
    holding: PLAYER_CTRL[i].confirm(),
    near: !!(nearDoor || nearStation),
    speed: +Math.hypot(p.vx, p.vz).toFixed(2), lean: +p.group.rotation.x.toFixed(3),
    body: p.bodyKey, skirtZ: +(p.skirt ? p.skirt.rotation.z : 0).toFixed(3) })),
  /* 擺姿勢拍照用：縮放、轉向、位置。給「角色特寫/宣傳圖」用的除錯接口，
     不影響遊戲邏輯（只是改 group 的 transform）。 */
  pose: (i, o) => { const p = players[i]; o = o || {};
    if (o.scale !== undefined) p.group.scale.setScalar(o.scale);
    if (o.facing !== undefined) { p.facing = o.facing; p.group.rotation.y = o.facing; }
    if (o.x !== undefined) p.group.position.x = o.x;
    if (o.z !== undefined) p.group.position.z = o.z;
    return { scale: p.group.scale.x, facing: +p.facing.toFixed(3),
             x: +p.group.position.x.toFixed(2), z: +p.group.position.z.toFixed(2) }; },
  teleport: (i, x, z) => { players[i].group.position.x = x; players[i].group.position.z = z; },
  bgmOn: () => BGM.on,
  toggleBgm: () => BGM.toggle(),
  footstepTest: () => { unlockAudio(); footstep(0.05, 1); return !!actx; },
  fight: () => (activeGame && activeGame.state ? activeGame.state() : null),
  arms: (i) => {
    const pl = players[i];
    return { shoulder: [+pl.arms[0].rotation.x.toFixed(2), +pl.arms[1].rotation.x.toFixed(2)],
             elbow:    [+pl.arms[0].elbow.rotation.x.toFixed(2), +pl.arms[1].elbow.rotation.x.toFixed(2)],
             gloves:   pl.gloves.map(g => g.visible), lean: +pl.group.rotation.x.toFixed(2) };
  },
  fightSetHp: (i, v) => (activeGame && activeGame.setHp ? activeGame.setHp(i, v) : null),
  ox: () => { const st = activeGame && activeGame.state ? activeGame.state() : null;
              return st && st.board ? st : null; },
  oxMove: (d) => { const st = window.__party.ox(); if (st && activeGame.onDir) activeGame.onDir(st.turn, d); return window.__party.ox(); },
  oxConfirm: () => { const st = window.__party.ox(); if (st && activeGame.onConfirm) activeGame.onConfirm(st.turn); return window.__party.ox(); },
  oxSet: (patch) => (activeGame && activeGame._set ? activeGame._set(patch) && window.__party.ox() : null),
  fightFinish: (w) => (activeGame && activeGame.finish ? activeGame.finish(w) : null),
  camera: () => (activeCam === cam ? 'lobby' : 'fight'),
  // 每道門在畫面裡的 NDC 座標（|x|、|y| 都要 <= 1 才代表完整可見）
  doors: () => DOORS.map((d) => {
    const v = (x, y, z) => { const p = new THREE.Vector3(x, y, z).project(cam);
                             return [+p.x.toFixed(2), +p.y.toFixed(2)]; };
    const half = 1.01 * SIGN_S / 2;
    const sp = d.sign ? d.sign.position : null;
    const base = v(d.x, 0, d.z);
    const top  = sp ? v(sp.x, sp.y + half, sp.z) : v(d.x, 3.4 * DOOR_S, d.z);
    const inside = (q) => Math.abs(q[0]) <= 1 && Math.abs(q[1]) <= 1;
    return { label: d.label, opensMenu: d.opensMenu || null,
             base, top, ok: inside(base) && inside(top) };
  }),
  outline: () => ({ n: OUTLINES.length,
                    scale: OUTLINES.length ? +OUTLINES[0].scale.x.toFixed(4) : null,
                    frustum: +frustum.toFixed(2), ffrustum: +ffrustum.toFixed(2),
                    cam: activeCam === fcam ? 'fight' : 'lobby' }),
  headKeys: () => HEAD_KEYS.slice(),
  // --- 頭部預覽（把一排示範角色擺出來，方便近距離檢查）---
  preview: (kinds, spacing) => {
    for (const o of (window.__prev || [])) scene.remove(o.group);
    window.__prev = [];
    const sp = spacing || 3.0;
    const x0 = -((kinds.length - 1) * sp) / 2;
    kinds.forEach((k, i) => {
      const pl = makeHuman(mix(i % 2), x0 + i * sp, 0);
      pl.group.rotation.y = Math.PI / 4;          // 面向相機
      if (k) setHead(pl, k);
      window.__prev.push(pl);
    });
    return window.__prev.length;
  },
  clearPreview: () => { for (const o of (window.__prev || [])) scene.remove(o.group); window.__prev = []; },
  setFrustum: (f) => {
    frustum = f;
    const a = innerWidth / innerHeight;
    cam.left = -frustum * a / 2; cam.right = frustum * a / 2;
    cam.top = frustum / 2; cam.bottom = -frustum / 2;
    cam.updateProjectionMatrix();
    return frustum;
  },
  /* 角色特寫用：把大廳相機搬到指定方位角/仰角（拍完用 cameraReset 還原）。
     等角相機的俯角 35° 太高，畫面只會看到頭頂 —— 檢查臉部時必須能平視。 */
  cameraTo: (o) => {
    o = o || {};
    const az = o.az !== undefined ? o.az : Math.PI / 4;
    const el = o.el !== undefined ? o.el : 0.10;
    const d  = o.d  !== undefined ? o.d  : 40;
    const ty = o.lookY !== undefined ? o.lookY : 1.10;
    const lx = o.lookX || 0, lz = o.lookZ || 0;
    cam.position.set(lx + Math.cos(el) * Math.sin(az) * d, Math.sin(el) * d + ty, lz + Math.cos(el) * Math.cos(az) * d);
    cam.lookAt(lx, ty, lz);
    cam.updateProjectionMatrix();
    return { az: +az.toFixed(2), el: +el.toFixed(2), ty, lx, lz };
  },
  cameraReset: () => {
    cam.position.set(34, 34, 34).addScaledVector(CAM_UP, CAM_SHIFT);
    cam.lookAt(CAM_UP.clone().multiplyScalar(CAM_SHIFT));
    return 1;
  },
  setHead: (i, k) => setHead(players[i], k),
  headHex: (i) => {
    const pl = players[i], h = pl.headParts.find(m => m.material && m.material.color);
    return { kind: pl.headKind, parts: pl.headParts.length, hair: pl.hairParts.map(x => x.visible),
             skull: pl.skull.visible, skullColor: '#' + pl.headMat.color.getHexString() };
  },
  pigDebug: () => players.map((pl, i) => ({
    who: i === 0 ? 'P1' : 'P2',
    headKind: pl.headKind,
    hairVisible: pl.hairParts.map(h => h.visible),
    hairCount: pl.hairParts.length,
    headColor: '#' + pl.headMat.color.getHexString(),
    headParts: pl.headParts.length,
    children: pl.head.children.length,
  })),
  gameDebug: () => {
    if (!activeGame || !activeGame.refs) return null;
    const { ball, P } = activeGame.refs;
    return { ball: { x: Math.round(ball.x), y: Math.round(ball.y), vx: Math.round(ball.vx), vy: Math.round(ball.vy), live: ball.live },
             px: P.map(p => Math.round(p.x)),
             py: P.map(p => Math.round(p.y)) };
  },
  lobby: () => ({ phase, head: players.map(p => p.headKind), lastResult }),
  menu: () => (menu ? { kind: menu.kind, sel: menu.sel, tiles: menuTiles().length,
                        shown: menuEl.classList.contains('on') } : null),
  openMenu: (k) => { openMenu(k); return window.__party.menu(); },
  menuMove: (d) => { if (!menu) return null; PRESSED[MENU_DIRKEY[0][d]] = true;
                     menuStep(); return window.__party.menu(); },
  menuOk: () => { if (!menu) return null; PRESSED['space'] = true; menuStep();
                  return { menu: window.__party.menu(), phase,
                           card: menuCard.textContent.replace(/\s+/g, ' ').slice(0, 400) }; },
  menuText: () => menuCard.textContent.replace(/\s+/g, ' ').slice(0, 900),
  recData: () => JSON.parse(JSON.stringify(rec)),
  stations: () => ({ stats: { x: STATS.x, z: STATS.z, r: STATS.r },
                     reset: { x: RESETP.x, z: RESETP.z, r: RESETP.r } }),
  debug: () => ({
    phase,
    keys: Object.keys(KEYS).filter(k => KEYS[k]),
    pressed: Object.keys(PRESSED).filter(k => PRESSED[k]),
    hasGame: !!activeGame,
    grids: (activeGame && activeGame.state) ? activeGame.state.map(s => s.game.grid) : null,
    scores: (activeGame && activeGame.state) ? activeGame.state.map(s => s.game.score) : null,
    tiles: (activeGame && activeGame.state) ? activeGame.state.map(s => [...s.tiles.values()].map(t => `${t.val}@${t.idx}`)) : null,
    dead: (activeGame && activeGame.state) ? activeGame.state.map(s => s.dead) : null,
  }),
};
</script>
<!-- 觸屏虛擬按鍵（觸屏裝置才顯示） -->
<div id="touchControls">
  <div class="tpad" id="padP1">
    <button data-k="w" data-area="u">▲</button>
    <button data-k="a" data-area="l">◀</button>
    <button data-k="s" data-area="d">▼</button>
    <button data-k="d" data-area="r">▶</button>
    <button data-k="space" class="conf">確認</button>
  </div>
  <div class="tpad" id="padP2">
    <button data-k="arrowup" data-area="u">▲</button>
    <button data-k="arrowleft" data-area="l">◀</button>
    <button data-k="arrowdown" data-area="d">▼</button>
    <button data-k="arrowright" data-area="r">▶</button>
    <button data-k="enter" class="conf">確認</button>
  </div>
</div>
