/* =========================== 2048 對戰小遊戲 =========================== */
const CANVAS_SS = 2;   // canvas 內部解析度倍率：繪圖座標一律用邏輯尺寸（960×540 等），
                       // backing store 放大 SS 倍後再用 CSS 縮放顯示 → 大螢幕放大也不會糊。
function createDuel2048() {
  const root = $('mini');
  const boardsEl = $('miniStage');
  const CELL = Math.max(44, Math.min(innerWidth * 0.100, innerHeight * 0.150));
  const GAP = CELL * 0.115;
  const PAD = CELL * 0.115;
  const BOARD = CELL * 4 + GAP * 3 + PAD * 2;

  const state = [0, 1].map(() => {
    const g = gNew(rng);
    return { game:g, tiles:new Map(), nextId:1, dead:false };
  });

  boardsEl.innerHTML = '';
  const views = state.map((s, i) => {
    const wrap = document.createElement('div');
    wrap.className = 'boardWrap';

    const board = document.createElement('div');
    board.className = 'board';
    board.style.width = BOARD + 'px';
    board.style.height = BOARD + 'px';

    for (let r = 0; r < 4; r++) for (let c = 0; c < 4; c++) {
      const bc = document.createElement('div');
      bc.className = 'bgCell';
      bc.style.width = CELL + 'px'; bc.style.height = CELL + 'px';
      bc.style.left = (PAD + c * (CELL + GAP)) + 'px';
      bc.style.top  = (PAD + r * (CELL + GAP)) + 'px';
      board.appendChild(bc);
    }
    const dead = document.createElement('div');
    dead.className = 'dead'; dead.textContent = '死局';
    board.appendChild(dead);

    wrap.appendChild(board);
    boardsEl.appendChild(wrap);

    const v = { wrap, board, dead, s };
    // 初始兩格
    s.game.grid.forEach((val, idx) => {
      if (!val) return;
      const t = placeTile(v, idx, val, true);
      setTimeout(() => t.el.classList.remove('spawn'), 220);
    });
    return v;
  });

  function xy(idx) {
    const r = Math.floor(idx / 4), c = idx % 4;
    return { x: PAD + c * (CELL + GAP), y: PAD + r * (CELL + GAP) };
  }

  function placeTile(v, idx, val, isNew) {
    const id = v.s.nextId++;
    const el = document.createElement('div');
    el.className = 'tile' + (isNew ? ' spawn' : '');
    el.style.width = CELL + 'px'; el.style.height = CELL + 'px';
    el.style.transform = `translate(${xy(idx).x}px,${xy(idx).y}px)`;
    const st = tileFont(val, CELL);
    el.style.background = tileColor(val);
    el.style.color = st.color; el.style.fontSize = st.fontSize;
    el.innerHTML = `<span class="v">${val}</span>`;
    v.board.appendChild(el);
    const t = { id, val, el, idx };
    v.s.tiles.set(id, t);
    return t;
  }

  function moveTile(t, idx) { t.idx = idx; t.el.style.transform = `translate(${xy(idx).x}px,${xy(idx).y}px)`; }

  function paint(t) {
    const st = tileFont(t.val, CELL);
    t.el.style.background = tileColor(t.val);
    t.el.style.color = st.color; t.el.style.fontSize = st.fontSize;
    t.el.firstChild.textContent = t.val;
    t.el.classList.add('pop');
    setTimeout(() => t.el.classList.remove('pop'), 100);
  }

  /** 依「追蹤版本」重算某一條線：回傳每個落點 {keepId, lostId, val, merged} 或 null */
  function resolveLine(line, dir) {
    // line: [{id,val}|null] × 4，index 0 ＝ 推往方向
    const items = line.filter(Boolean);
    const out = [];
    for (let i = 0; i < items.length; i++) {
      if (i + 1 < items.length && items[i].val === items[i + 1].val) {
        out.push({ keepId: items[i].id, lostId: items[i + 1].id, val: items[i].val * 2, merged: true });
        i++;
      } else {
        out.push({ keepId: items[i].id, lostId: null, val: items[i].val, merged: false });
      }
    }
    while (out.length < 4) out.push(null);
    return out;
  }

  function applyMove(v, dir) {
    const s = v.s;
    if (s.dead) return false;
    const res = gStep(s.game, dir, rng);
    if (!res.moved) return false;

    // 動畫：以 tile 身分追蹤
    const lines = gLines(dir);
    for (const idxs of lines) {
      const line = idxs.map(i => {
        let found = null;
        for (const t of s.tiles.values()) {
          if (t.idx === i) { found = t; break; }
        }
        return found ? { id: found.id, val: found.val } : null;
      });
      const resolved = resolveLine(line, dir);
      for (let k = 0; k < 4; k++) {
        const gi = idxs[k], cell = resolved[k];
        if (!cell) continue;
        const keep = s.tiles.get(cell.keepId);
        if (!keep) continue;
        moveTile(keep, gi);
        if (cell.merged) {
          const lost = s.tiles.get(cell.lostId);
          if (lost) {
            moveTile(lost, gi);
            s.tiles.delete(cell.lostId);
            setTimeout(() => lost.el.remove(), 120);
          }
          keep.val = cell.val;
          setTimeout(() => paint(keep), 110);
        }
      }
    }

    // 新生的格子
    if (res.spawned >= 0) {
      const val = s.game.grid[res.spawned];
      const t = placeTile(v, res.spawned, val, true);
      setTimeout(() => t.el.classList.remove('spawn'), 160);
    }

    $('s' + (v.index + 1)).textContent = s.game.score;
    if (res.over) {
      s.dead = true; v.dead.classList.add('on');
      v.wrap.classList.add('dim');
      $('st' + (v.index + 1)).textContent = '已死局';
      blip(180, 0.3, 0.10);
    } else {
      blip(520 + Math.min(res.gained, 64) * 4, 0.06, 0.05);
    }
    return true;
  }

  views.forEach((v, i) => { v.index = i; v.wrap._index = i; });

  return {
    id: 'duel2048',
    name: '2048 對戰',
    views, state,
    mount() {
      $('mini').classList.add('on');
      $('s1').textContent = '0'; $('s2').textContent = '0';
      $('st1').textContent = ''; $('st2').textContent = '';
      root.dataset.cell = CELL;
    },
    unmount() { $('mini').classList.remove('on'); },
    onDir(player, dir) { applyMove(views[player], dir); },
    allDead: () => state.every(s => s.dead),
    scores: () => state.map(s => s.game.score),
    detail: () => {
      const sc = state.map(s => s.game.score);
      const b  = state.map(s => { let m = 0; s.game.grid.forEach(v => { if (v > m) m = v; }); return m; });
      return `P1　${sc[0]} 分　最大方塊 ${b[0]}　｜　P2　${sc[1]} 分　最大方塊 ${b[1]}`;
    },
  };
}


/* =========================== 排球對戰（參考「皮卡丘打排球」的玩法） ===========================
   側視 1v1：中間一面網、重力球、碰到角色自動擊球、落地得分、先得 WIN_PTS 分者勝。
   角色＝程式繪製的原創簡單動物（P1 橘貓 / P2 藍蛙），不使用任何既有 IP 的角色。 */
function createDuelVolley() {
  const stage = $('miniStage');
  stage.innerHTML = '';

  const W = 960, H = 540;
  const GY = H - 48;                       // 地面（y 向下為正）
  const NET_X = W / 2, NET_W = 12, NET_TOP = GY - 176;
  const GAC = 1500;                        // 重力加速度
  const R = 19;                            // 球半徑（21:9 →調大一階）
  const PW = 74, PH = 84;                  // 角色尺寸
  const SPEED = 430, JUMP = 720;
  const WIN_PTS = 7;

  const cv = document.createElement('canvas');
  cv.width = W * CANVAS_SS; cv.height = H * CANVAS_SS;
  cv.style.cssText = 'display:block;max-width:96vw;max-height:78vh;width:auto;height:auto;border-radius:12px;box-shadow:0 14px 48px rgba(0,0,0,.65)';
  stage.appendChild(cv);
  const g = cv.getContext('2d'); g.scale(CANVAS_SS, CANVAS_SS);

  const mk = (side) => ({ side, x: side < 0 ? W * 0.22 : W * 0.78, y: GY, vy: 0, onGround: true, blush: 0 });
  const P = [mk(-1), mk(1)];
  const ball = { x: W * 0.36, y: 150, vx: 0, vy: 0, live: false, cool: 0, trail: [] };
  const score = [0, 0];
  let over = false, serveT = 1.0, msg = '', msgT = 0, shake = 0, flashA = 0, rally = 0;

  function reset(serverIdx) {
    ball.x = serverIdx === 0 ? W * 0.36 : W * 0.64;
    ball.y = 150; ball.vx = 0; ball.vy = 0; ball.live = false; ball.cool = 0; ball.trail.length = 0;
    serveT = 1.0; rally = 0;
    P.forEach((p, i) => { p.x = i === 0 ? W * 0.22 : W * 0.78; p.y = GY; p.vy = 0; p.onGround = true; p.blush = 0; });
    $('st1').textContent = serverIdx === 0 ? '發球' : '';
    $('st2').textContent = serverIdx === 1 ? '發球' : '';
  }

  function point(who) {
    score[who]++;
    $('s' + (who + 1)).textContent = score[who];
    flashA = 1; shake = 12;
    blip(who === 0 ? 820 : 560, 0.18, 0.13);
    const nm = who === 0 ? 'P1 紅' : 'P2 藍';
    if (score[who] >= WIN_PTS) {
      over = true; msg = nm + ' 拿下這局！';
      $('miniBottom').innerHTML = msg;
      return;
    }
    msg = nm + ' 得分　' + score[0] + ' : ' + score[1]; msgT = 1.4;
    reset(who);
  }

  function step(dt) {
    if (over) return;
    if (msgT > 0) msgT -= dt;
    if (shake > 0) shake = Math.max(0, shake - 70 * dt);
    if (flashA > 0) flashA = Math.max(0, flashA - 2.6 * dt);

    P.forEach((p, i) => {
      const h = HELD[i];
      p.x += ((h.right ? 1 : 0) - (h.left ? 1 : 0)) * SPEED * dt;
      const lo = i === 0 ? PW / 2 + 8 : NET_X + NET_W / 2 + PW / 2;
      const hi = i === 0 ? NET_X - NET_W / 2 - PW / 2 : W - PW / 2 - 8;
      p.x = Math.max(lo, Math.min(hi, p.x));
      if (h.up && p.onGround) { p.vy = -JUMP; p.onGround = false; }
      if (!p.onGround) {
        p.vy += GAC * dt; p.y += p.vy * dt;
        if (p.y >= GY) { p.y = GY; p.vy = 0; p.onGround = true; }
      }
      if (p.blush > 0) p.blush -= dt;
    });

    if (!ball.live) { serveT -= dt; if (serveT <= 0) { ball.live = true; ball.vy = 60; } return; }

    ball.vy += GAC * 0.62 * dt;
    ball.x += ball.vx * dt;
    ball.y += ball.vy * dt;
    if (ball.cool > 0) ball.cool -= dt;
    ball.trail.push({ x: ball.x, y: ball.y });
    if (ball.trail.length > 14) ball.trail.shift();

    if (ball.x - R < 0)   { ball.x = R;     ball.vx =  Math.abs(ball.vx) * 0.86; }
    if (ball.x + R > W)   { ball.x = W - R; ball.vx = -Math.abs(ball.vx) * 0.86; }
    if (ball.y - R < 0)   { ball.y = R;     ball.vy =  Math.abs(ball.vy) * 0.86; }

    // 網子：球在網頂以下時不能穿過
    if (ball.y > NET_TOP && Math.abs(ball.x - NET_X) < NET_W / 2 + R) {
      if (ball.x < NET_X) { ball.x = NET_X - NET_W / 2 - R; ball.vx = -Math.abs(ball.vx) * 0.6; }
      else               { ball.x = NET_X + NET_W / 2 + R; ball.vx =  Math.abs(ball.vx) * 0.6; }
    }

    // 擊球（碰到角色就自動打回去）
    if (ball.cool <= 0) {
      for (let i = 0; i < 2; i++) {
        const p = P[i], cx = p.x, cy = p.y - PH * 0.55;
        if (Math.hypot(ball.x - cx, ball.y - cy) < R + 42) {
          const t = Math.max(-1, Math.min(1, (ball.x - cx) / 48));
          const toward = i === 0 ? 1 : -1;
          const mv = (HELD[i].right ? 1 : 0) - (HELD[i].left ? 1 : 0);
          ball.vx = toward * (350 + Math.abs(t) * 170) + t * 120 + mv * 80;
          ball.vy = -(545 + t * 80);
          ball.cool = 0.15;
          p.blush = 0.35; rally++;
          shake = 5; blip(900 + Math.min(rally, 12) * 28, 0.05, 0.06);
          break;
        }
      }
    }

    // 落地
    if (ball.y + R >= GY) { ball.y = GY - R; point(ball.x < NET_X ? 1 : 0); }
  }

  /* ---------- 繪圖 ---------- */
  function shadow(x, y, r) {
    g.save(); g.globalAlpha = 0.3; g.fillStyle = '#000';
    g.beginPath(); g.ellipse(x, y + 3, r, r * 0.3, 0, 0, Math.PI * 2); g.fill(); g.restore();
  }
  /* ---------- 精靈圖管線（2026-10-17 新增）----------
     原本的 drawCat / drawFrog 向量圖完整保留。這層只做「有圖就貼圖、沒圖就交回原向量」。
     開關走網址參數，預設 both（＝線上直接看到新角色，原本的橘貓／藍蛙仍保留，加 ?sprite=off 就切回）：
       index.html                 → both（左＝咕咚藍裙、右＝咕咚粉裙）
       index.html?sprite=off      → 原樣（橘貓／藍蛙）
       index.html?sprite=p1       → 只有左邊換咕咚（藍），右邊仍是藍蛙
       index.html?sprite=p2       → 只有右邊換咕咚（粉），左邊仍是橘貓 */
  const SPRITE_MODE = (new URLSearchParams(location.search).get('sprite') || 'both').toLowerCase();
  const SP_USE = [SPRITE_MODE === 'p1' || SPRITE_MODE === 'both',
                  SPRITE_MODE === 'p2' || SPRITE_MODE === 'both'];
  const SPR = { blue: new Image(), pink: new Image() };
  if (SPRITE_MODE !== 'off') {
    SPR.blue.src = 'sprites/gudong-blue.png';
    SPR.pink.src = 'sprites/gudong-pink.png';
  }
  const spReady = (im) => !!(im && im.complete && im.naturalWidth > 0);
  window.__spriteDebug = () => ({ mode: SPRITE_MODE, use: SP_USE,
                                  blue: spReady(SPR.blue), pink: spReady(SPR.pink),
                                  size: [SPR.blue.naturalWidth, SPR.blue.naturalHeight] });
  /* 回傳 true＝已畫貼圖；false＝圖還沒載好，呼叫端改畫原本的向量圖（避免空白）
     ★ 只用一張圖（待機＝擊球同圖）：擊球動作已放棄，靠碰撞判定即可
     which：'blue'（左方，原色）｜'pink'（右方，粉裙）；facing：1 面朝右、-1 面朝左（鏡像） */
  const SPR_SCALE = 1.25;            // 人形比貓/蛙瘦，放大一點視覺量體才對得上
  function drawGudong(px, feetY, facing, which, st, hit) {
    const want = which === 'pink' ? SPR.pink : SPR.blue;
    const im = spReady(want) ? want : (spReady(SPR.blue) ? SPR.blue : null);   // 粉圖沒好就先借藍圖
    if (!im) return false;
    /* ---- L1 程序動畫：不動美術，只讓單張 PNG「活起來」-------------------------
       1 移動 → 上下 bob ＋ 微微傾斜（左右移動時重心跟著偏）
       2 擊球瞬間 → squash & stretch（橫向撐開、縱向壓扁，影子同步張開）
       3 站著 → 極緩的呼吸浮動，不再像一張貼紙釘在地上
       全部只在「繪製時」做 transform，圖片檔本身完全沒改，所以隨時可以關掉。 */
    const dx = (st && st.prevX !== undefined) ? px - st.prevX : 0;
    if (st) st.prevX = px;
    const moving = Math.abs(dx) > 0.35;
    if (st) st.walk = moving ? (st.walk || 0) + Math.min(Math.abs(dx) * 0.20, 0.45) : (st.walk || 0) * 0.88;
    const wk = st ? (st.walk || 0) : 0;
    const bob = moving ? Math.abs(Math.sin(wk)) * 3.2
                       : Math.sin(performance.now() / 1000 * 1.7) * 0.9;
    const sx = 1 + (hit ? 0.14 : 0);          // 擊球：橫向撐開
    const sy = 1 - (hit ? 0.10 : 0);          // 擊球：縱向壓扁
    const tilt = moving ? Math.sin(wk) * 0.035 * facing : 0;
    const h = PH * SPR_SCALE, w = (im.naturalWidth / im.naturalHeight) * h;
    shadow(px, feetY, Math.max(14, w * 0.42) * (1 + (hit ? 0.12 : 0)));   // 壓扁時影子張開 → 落地感
    g.save();
    g.translate(px, feetY - bob);
    g.rotate(tilt);
    g.scale(facing * sx, sy);         // facing=1 面朝右、-1 面朝左（同一張圖鏡像）
    g.drawImage(im, -w / 2, -h, w, h);
    g.restore();
    return true;
  }
  function drawCat(px, feetY, hitting) {          // P1 橘貓（面朝右）
    const cy = feetY - 40;
    shadow(px, feetY, 34);
    g.save(); g.translate(px, cy);
    g.strokeStyle = '#e08a34'; g.lineWidth = 9; g.lineCap = 'round';
    g.beginPath(); g.moveTo(-26, 16); g.quadraticCurveTo(-58, 10, -50, -26); g.stroke();
    g.fillStyle = '#f5a04a';
    g.beginPath(); g.ellipse(0, 0, 33, 38, 0, 0, Math.PI * 2); g.fill();
    g.beginPath(); g.moveTo(-24,-26); g.lineTo(-30,-52); g.lineTo(-7,-34); g.closePath(); g.fill();
    g.beginPath(); g.moveTo( 24,-26); g.lineTo( 30,-52); g.lineTo( 7,-34); g.closePath(); g.fill();
    g.fillStyle = '#ffe0bd';
    g.beginPath(); g.ellipse(3, 11, 20, 15, 0, 0, Math.PI * 2); g.fill();
    g.fillStyle = '#25292e';
    g.beginPath(); g.arc(-11,-4, 4.6, 0, Math.PI*2); g.fill();
    g.beginPath(); g.arc( 13,-4, 4.6, 0, Math.PI*2); g.fill();
    g.fillStyle = '#fff';
    g.beginPath(); g.arc(-9.5,-6, 1.6, 0, Math.PI*2); g.fill();
    g.beginPath(); g.arc( 14.5,-6, 1.6, 0, Math.PI*2); g.fill();
    g.fillStyle = '#e0725f';
    g.beginPath(); g.moveTo(-3,6); g.lineTo(5,6); g.lineTo(1,10); g.closePath(); g.fill();
    g.strokeStyle = 'rgba(255,255,255,.8)'; g.lineWidth = 1.6;
    [[-20,8,-38,3],[-20,13,-38,15]].forEach(a => { g.beginPath(); g.moveTo(a[0],a[1]); g.lineTo(a[2],a[3]); g.stroke(); });
    g.fillStyle = '#f5a04a';
    const ay = hitting ? -16 : 4;
    g.beginPath(); g.ellipse(31, ay, 9, 11.5, hitting ? -0.5 : 0, 0, Math.PI*2); g.fill();
    g.restore();
  }
  function drawFrog(px, feetY, hitting) {         // P2 藍蛙（面朝左）
    const cy = feetY - 38;
    shadow(px, feetY, 34);
    g.save(); g.translate(px, cy);
    g.fillStyle = '#4a93e0';
    g.beginPath(); g.ellipse(-20, 32, 13, 9, 0, 0, Math.PI*2); g.fill();
    g.beginPath(); g.ellipse( 20, 32, 13, 9, 0, 0, Math.PI*2); g.fill();
    g.fillStyle = '#5aa9ff';
    g.beginPath(); g.ellipse(0, 2, 34, 36, 0, 0, Math.PI*2); g.fill();
    g.fillStyle = '#cfe8ff';
    g.beginPath(); g.ellipse(-2, 14, 19, 16, 0, 0, Math.PI*2); g.fill();
    g.fillStyle = '#5aa9ff';
    g.beginPath(); g.arc(-15,-28, 13, 0, Math.PI*2); g.fill();
    g.beginPath(); g.arc( 13,-28, 13, 0, Math.PI*2); g.fill();
    g.fillStyle = '#fff';
    g.beginPath(); g.arc(-15,-29, 9, 0, Math.PI*2); g.fill();
    g.beginPath(); g.arc( 13,-29, 9, 0, Math.PI*2); g.fill();
    g.fillStyle = '#25292e';
    g.beginPath(); g.arc(-18,-27, 4.4, 0, Math.PI*2); g.fill();
    g.beginPath(); g.arc( 10,-27, 4.4, 0, Math.PI*2); g.fill();
    g.strokeStyle = '#2b6cb0'; g.lineWidth = 2.4;
    g.beginPath(); g.arc(-1, 4, 15, 0.28, Math.PI - 0.28); g.stroke();
    g.fillStyle = '#5aa9ff';
    const ay = hitting ? -16 : 4;
    g.beginPath(); g.ellipse(-31, ay, 9, 11.5, hitting ? 0.5 : 0, 0, Math.PI*2); g.fill();
    g.restore();
  }
  function drawBg() {
    const sky = g.createLinearGradient(0, 0, 0, H);
    sky.addColorStop(0, '#141b26'); sky.addColorStop(0.62, '#1d2735'); sky.addColorStop(1, '#243044');
    g.fillStyle = sky; g.fillRect(0, 0, W, H);
    g.fillStyle = 'rgba(255,255,255,.05)';
    for (let i = 0; i < 42; i++) { g.beginPath(); g.arc(16 + i * 23, 54 + (i % 3) * 17, 7, 0, Math.PI*2); g.fill(); }
    g.fillStyle = '#3a4a3c'; g.fillRect(0, GY, W, H - GY);
    g.fillStyle = 'rgba(255,255,255,.09)'; g.fillRect(0, GY, W, 3);
    g.fillStyle = '#8d9aa8'; g.fillRect(NET_X - NET_W/2, NET_TOP, NET_W, GY - NET_TOP);
    g.strokeStyle = 'rgba(232,240,250,.5)'; g.lineWidth = 1.2;
    for (let y = NET_TOP + 7; y < GY - 4; y += 11) { g.beginPath(); g.moveTo(NET_X - NET_W/2, y); g.lineTo(NET_X + NET_W/2, y); g.stroke(); }
    g.fillStyle = '#e8eef5'; g.fillRect(NET_X - 14, NET_TOP - 6, 28, 7);
    g.fillStyle = 'rgba(255,255,255,.14)'; g.fillRect(NET_X - 1, GY, 2, 30);
  }
  function drawBall() {
    for (let i = 0; i < ball.trail.length; i++) {
      const t = ball.trail[i], k = i / Math.max(1, ball.trail.length);
      g.globalAlpha = k * 0.32; g.fillStyle = '#ffe680';
      g.beginPath(); g.arc(t.x, t.y, R * (0.3 + k * 0.55), 0, Math.PI*2); g.fill();
    }
    g.globalAlpha = 1;
    const grd = g.createRadialGradient(ball.x - 5, ball.y - 6, 2, ball.x, ball.y, R);
    grd.addColorStop(0, '#fff8bd'); grd.addColorStop(0.62, '#ffd23f'); grd.addColorStop(1, '#dfa400');
    g.fillStyle = grd; g.beginPath(); g.arc(ball.x, ball.y, R, 0, Math.PI*2); g.fill();
    g.strokeStyle = 'rgba(120,88,0,.45)'; g.lineWidth = 1.6;
    g.beginPath(); g.arc(ball.x, ball.y, R, 0, Math.PI*2); g.stroke();
    g.fillStyle = 'rgba(255,255,255,.75)';
    g.beginPath(); g.arc(ball.x - 5, ball.y - 6, 4, 0, Math.PI*2); g.fill();
  }
  function draw() {
    g.setTransform(CANVAS_SS, 0, 0, CANVAS_SS, 0, 0);
    g.textAlign = 'center';
    if (shake > 0) g.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
    drawBg();
    const hitPose = ball.cool > 0.07;   // 只給原本的向量圖（貓／蛙）用；咕咚是單張圖
    if (!(SP_USE[0] && drawGudong(P[0].x, P[0].y,  1, 'blue', P[0], hitPose))) drawCat (P[0].x, P[0].y, hitPose);
    if (!(SP_USE[1] && drawGudong(P[1].x, P[1].y, -1, 'pink', P[1], hitPose))) drawFrog(P[1].x, P[1].y, hitPose);
    drawBall();
    if (!ball.live && serveT > 0 && !over) {
      g.fillStyle = 'rgba(255,255,255,.85)'; g.font = 'bold 22px system-ui';
      g.fillText('準備發球…', W / 2, 96);
    }
    if (msgT > 0 && !over) {
      g.globalAlpha = Math.min(1, msgT); g.fillStyle = '#fff'; g.font = 'bold 34px system-ui';
      g.fillText(msg, W / 2, 112); g.globalAlpha = 1;
    }
    if (over) {
      g.fillStyle = 'rgba(6,9,14,.66)'; g.fillRect(0, 0, W, H);
      g.fillStyle = '#fff'; g.font = 'bold 44px system-ui';
      g.fillText(msg || '結束', W / 2, H / 2 - 8);
      g.fillStyle = '#9fd0ff'; g.font = 'bold 26px system-ui';
      g.fillText(score[0] + ' : ' + score[1], W / 2, H / 2 + 40);
    }
    if (flashA > 0) { g.fillStyle = 'rgba(255,255,255,' + (flashA * 0.3) + ')'; g.fillRect(0, 0, W, H); }
  }

  reset(0);
  return {
    id: 'duelVolley', name: '電氣鼠排球',
    mount() {
      $('mini').classList.add('on');
      $('s1').textContent = '0'; $('s2').textContent = '0';
      reset(0);
    },
    unmount() { $('mini').classList.remove('on'); },
    onDir() {},                                   // 運動型遊戲不用一格一動
    update(dt) { step(dt); draw(); },
    allDead: () => over,
    scores: () => score.slice(),
    detail: () => `P1　${score[0]} 分　｜　P2　${score[1]} 分`,
    refs: { ball, P },
  };
}

/* =========================== 橫版對戰小遊戲 ===========================
   側視 1v1。上＝攻擊、下＝防禦（按住）、左右移動。血量歸零就倒地。
   角色直接用大廳那兩隻 —— 所以變過頭的會用變過的頭打。
   注意：主迴圈會先把方向鍵的「邊緣觸發」吃掉再呼叫 update()，
        所以攻擊必須走 onDir() 介面，不能在 update() 裡讀 PRESSED。
   ====================================================================== */
function createDuelFight() {
  const MAXHP = 100, ATK_RANGE = 2.6, ATK_DUR = 0.45, ATK_COOL = 0.60;
  const SPEED = 7.6, HURT_T = 0.26, KNOCK_HIT = 1.25, KNOCK_GUARD = 0.35;
  const MIN_SEP = 1.15;          // 兩人最近距離（不能互相穿過）

  const S = {
    hp: [MAXHP, MAXHP],
    st: ['idle', 'idle'],          // idle | attack | hurt | dead  （block 由輸入即時決定）
    t: [0, 0], cool: [0, 0],
    hitDone: [false, false],
    over: false, winner: -1, deadT: 0,
  };
  const queued = [false, false];
  const sparks = [];

  /* 拳擊姿勢：肩 rotation.x（負 = 往前抬）與 肘 elbow.rotation.x
       放下 → 雙手自然垂在身側
       防禦 → 上臂微垂、前臂抬到臉前（拳擊護臉）
       攻擊 → 手臂打直往前（總角度 −1.57 = 水平指向對手） */
  const POSE = {
    down:  { sh: -0.12, el: -0.30 },
    guard: { sh: -0.35, el: -2.25 },
    punch: { sh: -1.30, el: -0.27 },
  };
  const lerp = (a, b, t) => a + (b - a) * t;
  const setArm = (pl, k, sh, el) => { pl.arms[k].rotation.x = sh; pl.arms[k].elbow.rotation.x = el; };
  // 哪隻手比較靠近相機：P1 面向 +x 是 arms[0]；P2 面向 −x 剛好相反
  const nearArm = (i) => (i === 0 ? 0 : 1);

  // 進場前的原位，離場要還原
  const home = players.map(p => ({ pos: p.group.position.clone(), face: p.facing }));

  function place() {
    players.forEach((p, i) => {
      p.group.position.set(ARENA_X + (i === 0 ? -3.4 : 3.4), 0, 0);
      p.group.rotation.set(0, i === 0 ? Math.PI / 2 : -Math.PI / 2, 0);
      p.facing = i === 0 ? Math.PI / 2 : -Math.PI / 2;
      p.walk = 0;
      p.group.rotation.x = 0;
      p.legs[0].rotation.x = p.legs[1].rotation.x = 0;
      p.arms.forEach(a => { a.rotation.x = 0; a.elbow.rotation.x = 0; });
      p.gloves.forEach(g => { g.visible = true; });      // 上場戴拳擊手套
    });
  }
  place();

  const clampX = (x) => Math.max(ARENA_X - ARENA_HALF, Math.min(ARENA_X + ARENA_HALF, x));

  function spark(x, y, color) {
    const m = new THREE.Mesh(new THREE.SphereGeometry(0.2, 10, 8),
      new THREE.MeshBasicMaterial({ color, transparent: true, opacity: 0.95 }));
    m.position.set(x, y, 0.25);
    scene.add(m);
    sparks.push({ m, t: 0 });
  }

  function drawTop() {
    for (let i = 0; i < 2; i++) {
      const pct = Math.round(S.hp[i] / MAXHP * 100);
      $('s' + (i + 1)).textContent = String(S.hp[i]);
      $('st' + (i + 1)).innerHTML = '<div class="hpb"><i class="' + (pct <= 30 ? 'low' : '') +
        '" style="width:' + pct + '%"></i></div>';
    }
  }

  function hit(i) {
    const o = 1 - i;
    if (S.over || S.st[o] === 'dead') return;
    const a = players[i].group.position.x, b = players[o].group.position.x;
    if (Math.abs(a - b) > ATK_RANGE) { blip(150, 0.05, 0.03); return; }    // 揮空
    const guarded = HELD[o].down;
    const dmg = guarded ? 4 : 14;
    S.hp[o] = Math.max(0, S.hp[o] - dmg);

    const dir = Math.sign(b - a) || 1;
    players[o].group.position.x = clampX(b + dir * (guarded ? KNOCK_GUARD : KNOCK_HIT));
    spark((a + b) / 2, 1.8, guarded ? 0x9ad8ff : 0xffd34d);
    if (guarded) { blip(430, 0.06, 0.06); blip(300, 0.09, 0.05); }
    else         { blip(175, 0.11, 0.09); }

    if (S.hp[o] <= 0) { S.st[o] = 'dead'; S.over = true; S.winner = i; S.deadT = 0; }
    else              { S.st[o] = 'hurt'; S.t[o] = HURT_T; }
    drawTop();
  }

  return {
    ownsScene: true,
    mount() { $('mini').classList.add('on'); activeCam = fcam; drawTop(); },
    unmount() {
      $('mini').classList.remove('on');
      $('mini').classList.remove('scene');
      activeCam = cam;
      players.forEach((p, i) => {
        p.group.position.copy(home[i].pos);
        p.group.rotation.set(0, home[i].face, 0);
        p.facing = home[i].face;
        p.walk = 0;
        p.legs[0].rotation.x = p.legs[1].rotation.x = 0;
        p.arms.forEach(a => { a.rotation.x = 0; a.elbow.rotation.x = 0; });
        p.gloves.forEach(g => { g.visible = false; });              // 脫下手套
      });
      for (const s of sparks) { scene.remove(s.m); s.m.geometry.dispose(); s.m.material.dispose(); }
      sparks.length = 0;
    },
    /** 主迴圈把方向鍵的邊緣觸發丟進來：上＝攻擊 */
    onDir(i, d) { if (d === 'up') queued[i] = true; },

    update(dt) {
      // ---- 已經分出勝負：讓輸家倒下去 ----
      if (S.over) {
        S.deadT += dt;
        for (let i = 0; i < 2; i++) {
          if (S.st[i] !== 'dead') continue;
          const o = 1 - i;
          const dir = Math.sign(players[i].group.position.x - players[o].group.position.x) || 1;
          players[i].group.rotation.z = -dir * Math.min(1, S.deadT / 0.5) * 1.45;
        }
      } else {
        for (let i = 0; i < 2; i++) {
          const p = players[i], st = S.st[i];
          S.cool[i] = Math.max(0, S.cool[i] - dt);

          const wantAtk = queued[i] || padPressed(i, 0);
          queued[i] = false;

          if (st === 'hurt') {
            S.t[i] -= dt;
            p.legs[0].rotation.x = p.legs[1].rotation.x = 0;
            if (S.t[i] <= 0) S.st[i] = 'idle';
            continue;
          }

          if (st === 'attack') {
            S.t[i] -= dt;
            const k = 1 - Math.max(0, S.t[i]) / ATK_DUR;               // 0 → 1
            const ext = Math.sin(Math.min(1, k / 0.55) * Math.PI);     // 打出去再收回
            const na = nearArm(i);
            setArm(p, na, lerp(POSE.guard.sh, POSE.punch.sh, ext),
                          lerp(POSE.guard.el, POSE.punch.el, ext));    // 出拳的那隻手
            setArm(p, 1 - na, POSE.guard.sh, POSE.guard.el);           // 另一手留在臉前護著
            p.group.rotation.x = 0.14 * ext;                           // 出拳時身體微前傾
            p.legs[0].rotation.x = 0.16; p.legs[1].rotation.x = -0.16;
            if (!S.hitDone[i] && k > 0.42) {
              S.hitDone[i] = true;
              S.fireCount = S.fireCount || [0, 0]; S.fireCount[i]++;
              hit(i);
            }
            if (S.t[i] <= 0) {
              S.st[i] = 'idle';
              p.group.rotation.x = 0;
              setArm(p, 0, POSE.down.sh, POSE.down.el);
              setArm(p, 1, POSE.down.sh, POSE.down.el);
              p.legs[0].rotation.x = p.legs[1].rotation.x = 0;
            }
            continue;
          }

          // ---- 防禦（按住下）----
          const guarded = HELD[i].down;

          // ---- 攻擊（上）----
          if (S.cool[i] <= 0 && wantAtk) {
            S.st[i] = 'attack'; S.t[i] = ATK_DUR; S.cool[i] = ATK_COOL; S.hitDone[i] = false;
            S.atkCount = S.atkCount || [0, 0]; S.atkCount[i]++;
            blip(255, 0.05, 0.05);
            continue;
          }

          // ---- 移動 ----
          let v = (HELD[i].right ? 1 : 0) - (HELD[i].left ? 1 : 0);
          if (guarded) v *= 0.35;                                       // 防禦時走得慢
          if (v) p.group.position.x = clampX(p.group.position.x + v * SPEED * dt);

          const moving = Math.abs(v) > 0.05;
          p.idle += dt;                    // 戰鬥時大廳邏輯不跑，時間自己累加
          p.walk = moving ? p.walk + dt * 9.5 : p.walk * Math.max(0, 1 - dt * 12);
          const sw = Math.sin(p.walk) * (moving ? 0.55 : 0);
          const legSw2 = p.skirt ? sw * (p.legSwing || 0.22) : sw;      // 長裙：腿只微動，裙子自己擺
          p.legs[0].rotation.x =  legSw2; p.legs[1].rotation.x = -legSw2;
          if (p.skirt) p.skirt.rotation.z = Math.sin(p.walk) * (moving ? 0.065 : 0);
          // 待機呼吸 —— 戰鬥時角色最大、最該有生命感，站著不動也要有起伏
          const br = moving ? 0 : Math.sin(p.idle * 1.7);
          p.torso.scale.y = 1 + br * 0.018;
          p.group.position.y = br * 0.016 + 0.010;
          if (guarded) {                                              // 防禦：前臂抬到臉前
            setArm(p, 0, POSE.guard.sh + br * 0.03, POSE.guard.el);
            setArm(p, 1, POSE.guard.sh - br * 0.03, POSE.guard.el);
          } else {                                                    // 放下（走動時手臂微擺）
            const bob = sw * 0.14 + br * 0.045;
            setArm(p, 0, POSE.down.sh + bob, POSE.down.el);
            setArm(p, 1, POSE.down.sh - bob, POSE.down.el);
          }
        }
      }

      if (!S.over) {
        // ---- 兩人不可互相穿過（沒有的話會直接走過去變成背對背）----
        const x0 = players[0].group.position.x, x1 = players[1].group.position.x;
        const d = x1 - x0;
        if (Math.abs(d) < MIN_SEP) {
          const push = (MIN_SEP - Math.abs(d)) / 2;
          const sg = Math.sign(d) || 1;
          players[0].group.position.x = clampX(x0 - sg * push);
          players[1].group.position.x = clampX(x1 + sg * push);
        }
      }
      // ---- 永遠面對對手 ----
      const p0 = players[0].group.position.x, p1 = players[1].group.position.x;
      players[0].group.rotation.y = (p1 >= p0) ?  Math.PI / 2 : -Math.PI / 2;
      players[1].group.rotation.y = (p0 >= p1) ?  Math.PI / 2 : -Math.PI / 2;

      players.forEach((p) => blinkTick(p, dt));       // 戰鬥中也要眨眼

      // 火花
      for (let i = sparks.length - 1; i >= 0; i--) {
        const sp = sparks[i]; sp.t += dt;
        sp.m.scale.setScalar(1 + sp.t * 5.5);
        sp.m.material.opacity = Math.max(0, 0.95 - sp.t * 4.5);
        if (sp.t > 0.24) { scene.remove(sp.m); sp.m.geometry.dispose(); sp.m.material.dispose(); sparks.splice(i, 1); }
      }
      drawTop();
    },

    // 除錯／測試用：直接設血量
    setHp: (i, v) => { S.hp[i] = Math.max(0, Math.min(MAXHP, v)); drawTop(); return S.hp[i]; },
    // 除錯／測試用：強制結束（指定贏家）
    finish: (winner) => {
      const loser = 1 - winner;
      S.hp[loser] = 0; S.st[loser] = 'dead'; S.over = true; S.winner = winner; S.deadT = 0;
      drawTop();
    },
    // 等倒地動畫播完才進結算畫面
    allDead: () => S.over && S.deadT > 0.75,
    scores: () => [S.hp[0], S.hp[1]],       // 血多的贏
    detail: () => `P1 剩 ${S.hp[0]} HP　｜　P2 剩 ${S.hp[1]} HP`,
    state: () => ({
      hp: S.hp.slice(), st: S.st.slice(), over: S.over, winner: S.winner, deadT: +S.deadT.toFixed(2),
      px: players.map(p => +(p.group.position.x - ARENA_X).toFixed(2)),   // 相對競技場中心
      held: HELD.map(h => ({ l: h.left, r: h.right, u: h.up, d: h.down })),
      cool: S.cool.map(c => +c.toFixed(2)),
      atk: (S.atkCount || [0, 0]).slice(),
      fires: (S.fireCount || [0, 0]).slice(),
    }),
  };
}

/* =========================== OX 移動圈叉 ===========================
   3x3、每人 4 顆。輪到你時可以：
     (a) 指向空格按確認 → 放下新棋子（手上還有才行）
     (b) 指向自己的棋子按確認 → 拿起；再指向空格按確認 → 放下
     ★ 放回同一格 = 拿錯，當作沒動（不消耗這一步、不換手）
     三連線者勝。（規則先用 tools/ox-analyze.js 驗證過：
     4 顆 + 可移到任意空格 = 沒有必勝法也不會偏先攻）
   ====================================================================== */
function createDuelOX() {
  const N = 4, MAX_MOVES = 40;                 // 平均 14.6 步，40 是安全上限
  const LINES = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];

  const S = {
    board: new Array(9).fill(0),   // 0 空 / 1 P1(X) / 2 P2(O)
    hand: [N, N],
    turn: 0,
    cursor: 4,
    held: -1,                      // 拿起的格子索引，-1 = 沒拿
    over: false, winner: -1, moves: 0, overT: 0, winLine: null,
  };
  let popIdx = -1, popT = 0, dropT = 0, msgT = 0;

  // ---------- DOM ----------
  const stage = $('miniStage');
  stage.innerHTML =
    '<div class="oxWrap">' +
      '<div class="oxSide p1" id="oxS1"><div class="nm">P1 紅</div>' +
        '<div class="big" id="oxH1">4</div><div class="lbl" id="oxL1">剩餘棋子</div></div>' +
      '<div class="oxBoardBox">' +
        '<div class="oxHelp">指向自己的棋子＋確認 = 拿起　·　再指向空格＋確認 = 放下　·　放回同一格 = 拿錯取消</div>' +
        '<div class="oxBoard" id="oxBoard"></div>' +
        '<div class="oxHand" id="oxHand"><b class="ar">▼</b><span class="ic">🖐</span></div>' +
        '<div class="oxMsg" id="oxMsg"></div>' +
      '</div>' +
      '<div class="oxSide p2" id="oxS2"><div class="nm">P2 藍</div>' +
        '<div class="big" id="oxH2">4</div><div class="lbl" id="oxL2">剩餘棋子</div></div>' +
    '</div>';

  const boardEl = $('oxBoard'), handEl = $('oxHand'), msgEl = $('oxMsg');
  const s1 = $('oxS1'), s2 = $('oxS2');
  const cells = [];
  for (let i = 0; i < 9; i++) {
    const c = document.createElement('div');
    c.className = 'oxCell';
    boardEl.appendChild(c);
    cells.push(c);
  }

  const glyph = (v) => (v === 1 ? '✕' : v === 2 ? '◯' : '');
  const meOf = () => S.turn + 1;

  // ---------- 畫面 ----------
  function render() {
    for (let i = 0; i < 9; i++) {
      const c = cells[i];
      c.className = 'oxCell' +
        (S.board[i] === 1 ? ' p1' : S.board[i] === 2 ? ' p2' : '') +
        (i === S.cursor ? ' cur' : '') +
        (S.winLine && S.winLine.includes(i) ? ' win' : '');
      if (!c.querySelector('span')) c.appendChild(document.createElement('span'));
      const t = glyph(S.board[i]);
      if (c.firstChild.textContent !== t) c.firstChild.textContent = t;
    }
    // 手的位置：對齊游標那格
    const c = cells[S.cursor];
    handEl.style.left = (c.offsetLeft + c.offsetWidth / 2) + 'px';
    handEl.style.top  = (c.offsetTop + c.offsetHeight / 2) + 'px';
    handEl.classList.toggle('grab', S.held >= 0);

    // 兩側剩餘棋子
    $('oxH1').textContent = String(S.hand[0]);
    $('oxH2').textContent = String(S.hand[1]);
    s1.classList.toggle('turn', !S.over && S.turn === 0);
    s2.classList.toggle('turn', !S.over && S.turn === 1);
    $('oxL1').textContent = S.over ? '' : (S.turn === 0 ? '輪到你' : '等待中');
    $('oxL2').textContent = S.over ? '' : (S.turn === 1 ? '輪到你' : '等待中');

    // 手上有棋子時，把手抓的東西畫出來
    let hold = handEl.querySelector('.hold');
    if (S.held >= 0) {
      if (!hold) { hold = document.createElement('span'); hold.className = 'hold'; handEl.appendChild(hold); }
      hold.textContent = glyph(meOf());
      hold.style.color = S.turn === 0 ? 'var(--p1)' : 'var(--p2)';
    } else if (hold) hold.remove();
  }

  function flash(msg) {
    msgEl.textContent = msg;
    msgEl.classList.add('on');
    msgT = 1.6;
  }

  // ---------- 規則 ----------
  function lineOf() {
    for (const L of LINES) {
      const v = S.board[L[0]];
      if (v && v === S.board[L[1]] && v === S.board[L[2]]) return L;
    }
    return null;
  }

  function endTurn() {
    S.moves++;
    const L = lineOf();
    if (L) { S.over = true; S.winner = S.board[L[0]] - 1; S.winLine = L; S.overT = 0; }
    else if (S.moves >= MAX_MOVES) { S.over = true; S.winner = -1; S.overT = 0; flash('步數用盡 — 和局'); }
    else { S.turn = 1 - S.turn; S.cursor = 4; }     // 換手，游標回中間
  }

  function doConfirm() {
    if (S.over) return;
    const i = S.cursor, me = meOf();

    if (S.held >= 0) {                              // 手上有棋子
      if (i === S.held) {                           // ★ 放回同一格 = 拿錯，當作沒動
        S.board[S.held] = me;                       // 把棋子放回原格
        S.held = -1;
        flash('放回同一格 — 當作沒動');
        render(); return;
      }
      if (S.board[i] !== 0) { flash('那裡有棋子了'); render(); return; }
      S.board[i] = me;                              // 拿起時原格已清空，直接放到新格
      S.held = -1;
      dropT = 0.34; handEl.classList.add('drop');
      popCell(i);
      render(); endTurn(); render(); return;
    }

    if (S.board[i] === me) {                        // 指向自己的棋子 → 拿起
      S.held = i;
      S.board[i] = 0;                               // ★ 拿在手上 → 原格清空（不然看不出拿起來了）
      flash('拿起了 — 再指向空格放下');
      render(); return;
    }
    if (S.board[i] !== 0) { flash('那是對手的棋子'); render(); return; }
    if (S.hand[S.turn] <= 0) { flash('手上的棋子用完了 — 只能搬動場上的'); render(); return; }

    S.board[i] = me;                                // 直接放下新棋子
    S.hand[S.turn]--;
    dropT = 0.34; handEl.classList.add('drop');
    popCell(i);
    render(); endTurn(); render();
  }

  function popCell(i) {
    const c = cells[i];
    c.classList.remove('pop'); void c.offsetWidth; c.classList.add('pop');
    popIdx = i; popT = 0;
  }

  const DIRS = { up: [-1, 0], down: [1, 0], left: [0, -1], right: [0, 1] };
  function doMove(d) {
    if (S.over) return;
    const [dr, dc] = DIRS[d] || [0, 0];
    let r = (S.cursor / 3) | 0, c = S.cursor % 3;
    r = Math.max(0, Math.min(2, r + dr));
    c = Math.max(0, Math.min(2, c + dc));
    S.cursor = r * 3 + c;
    render();
  }

  return {
    mount() { $('mini').classList.add('on'); render(); },
    unmount() { $('mini').classList.remove('on'); stage.innerHTML = ''; },
    onDir(i, d) { if (i === S.turn) doMove(d); },        // 只有當前玩家能動游標
    onConfirm(i) { if (i === S.turn) doConfirm(); },     // 只有當前玩家能按確認
    update(dt) {
      if (popIdx >= 0) { popT += dt; if (popT > 0.4) { cells[popIdx].classList.remove('pop'); popIdx = -1; } }
      if (dropT > 0) { dropT -= dt; if (dropT <= 0) handEl.classList.remove('drop'); }
      if (msgT > 0) { msgT -= dt; if (msgT <= 0) msgEl.classList.remove('on'); }
      if (S.over) { S.overT += dt; render(); }
    },
    allDead: () => S.over && S.overT > 0.9,      // 讓連線打光停留一下再進結算
    scores: () => [S.winner === 0 ? 1 : 0, S.winner === 1 ? 1 : 0],
    detail: () => S.winner === -1
      ? `共 ${S.moves} 步　·　雙方都無法連線`
      : `用 ${S.moves} 步完成三連線　·　${S.winner === 0 ? 'P2 藍' : 'P1 紅'} 手上還剩 ${S.hand[(S.winner + 1) % 2]} 顆`,
    state: () => ({ board: S.board.slice(), hand: S.hand.slice(), turn: S.turn,
                    cursor: S.cursor, held: S.held, over: S.over, winner: S.winner,
                    moves: S.moves, winLine: S.winLine }),
    _set: (patch) => { Object.assign(S, patch); render(); return S; },   // 測試用
  };
}

/* =========================== 搶水果（fruit grab） ===========================
   天上掉水果，左右移動用籃子接住（每種水果同分）。偶爾掉加速／籃子加大道具。
   先達 15 分者勝，或 45 秒到比誰多。 */
function createDuelFruit() {
  const stage = $('miniStage'); stage.innerHTML = '';
  const W = 960, H = 540, GY = H - 74;
  const WIN = 15, TIME = 45;
  const cv = document.createElement('canvas');
  cv.width = W * CANVAS_SS; cv.height = H * CANVAS_SS;
  cv.style.cssText = 'display:block;max-width:96vw;max-height:78vh;width:auto;height:auto;border-radius:12px;box-shadow:0 14px 48px rgba(0,0,0,.65)';
  stage.appendChild(cv);
  const g = cv.getContext('2d'); g.scale(CANVAS_SS, CANVAS_SS);
  const EM = ['🍎', '🍌', '🍇', '🍊', '🍉'];
  const P = [
    { x: W * 0.25, w: 88, spd: 380, boost: 0, wide: 0, sc: 0, col: '#ff6b6b' },
    { x: W * 0.75, w: 88, spd: 380, boost: 0, wide: 0, sc: 0, col: '#5aa9ff' },
  ];
  const items = [];          // {x, y, vy, k:'fruit'|'boost'|'wide', emo}
  let time = TIME, spawnT = 0, propT = 4, over = false, winner = -1;

  const spawnFruit = () => items.push({ x: 40 + rng() * (W - 80), y: -30, vy: 210 + rng() * 150, k: 'fruit', emo: EM[(rng() * EM.length) | 0] });
  const spawnProp = () => { const b = rng() < 0.5; items.push({ x: 40 + rng() * (W - 80), y: -30, vy: 170, k: b ? 'boost' : 'wide', emo: b ? '👟' : '🧺' }); };

  function step(dt) {
    if (over) return;
    time -= dt;
    spawnT -= dt; propT -= dt;
    if (spawnT <= 0) { spawnFruit(); spawnT = 0.6 - Math.min(0.3, (TIME - time) * 0.008); }
    if (propT <= 0) { spawnProp(); propT = 5 + rng() * 4; }
    P.forEach((p, pi) => {
      const h = HELD[pi];
      p.x += ((h.right ? 1 : 0) - (h.left ? 1 : 0)) * p.spd * (p.boost > 0 ? 1.8 : 1) * dt;
      p.x = Math.max(pi === 0 ? 20 : W / 2 + 10, Math.min(pi === 0 ? W / 2 - 10 : W - 20, p.x));
      if (p.boost > 0) p.boost -= dt;
      if (p.wide > 0) p.wide -= dt;
    });
    for (let i = items.length - 1; i >= 0; i--) {
      const it = items[i]; it.y += it.vy * dt;
      if (it.y < GY - 30) continue;
      let caught = false;
      for (let pi = 0; pi < 2 && !caught; pi++) {
        const p = P[pi], w = p.w * (p.wide > 0 ? 1.6 : 1);
        if (Math.abs(it.x - p.x) < w / 2 && it.y < GY + 10) {
          if (it.k === 'fruit') { p.sc++; blip(680 + pi * 60, 0.06, 0.06); }
          else if (it.k === 'boost') { p.boost = 4; blip(520, 0.09, 0.07); }
          else { p.wide = 5; blip(620, 0.09, 0.07); }
          caught = true;
        }
      }
      if (caught || it.y > GY + 44) items.splice(i, 1);
    }
    $('s1').textContent = P[0].sc; $('s2').textContent = P[1].sc;
    $('st1').textContent = P[0].boost > 0 ? '加速!' : (P[0].wide > 0 ? '大籃!' : '');
    $('st2').textContent = P[1].boost > 0 ? '加速!' : (P[1].wide > 0 ? '大籃!' : '');
    if (P[0].sc >= WIN || P[1].sc >= WIN) { over = true; winner = P[0].sc >= WIN ? 0 : 1; }
    else if (time <= 0) { over = true; winner = P[0].sc === P[1].sc ? -1 : (P[0].sc > P[1].sc ? 0 : 1); }
  }

  function draw() {
    g.fillStyle = '#14222e'; g.fillRect(0, 0, W, H);
    g.fillStyle = '#2c3e50'; g.fillRect(0, GY - 8, W, 12);
    g.fillStyle = 'rgba(255,255,255,.7)'; g.font = 'bold 22px system-ui';
    g.fillText('⏱ ' + Math.max(0, Math.ceil(time)) + 's', W - 90, 34);
    for (const it of items) { g.font = '42px system-ui'; g.fillText(it.emo, it.x - 21, it.y); }
    P.forEach((p) => {
      const w = p.w * (p.wide > 0 ? 1.6 : 1);
      g.fillStyle = p.col; g.beginPath();
      g.ellipse(p.x, GY - 60, 20, 20, 0, 0, Math.PI * 2); g.fill();       // 角色頭
      g.fillStyle = '#5a3a22'; g.fillRect(p.x - w / 2, GY - 36, w, 36);     // 籃子
      g.strokeStyle = '#3a2818'; g.lineWidth = 4; g.strokeRect(p.x - w / 2, GY - 36, w, 36);
    });
    if (over) {
      g.fillStyle = 'rgba(6,9,14,.66)'; g.fillRect(0, 0, W, H);
      g.fillStyle = '#fff'; g.font = 'bold 44px system-ui';
      g.fillText(winner < 0 ? '平手！' : (winner === 0 ? 'P1 紅 勝' : 'P2 藍 勝'), W / 2, H / 2);
      g.font = 'bold 26px system-ui'; g.fillStyle = '#9fd0ff';
      g.fillText(P[0].sc + ' : ' + P[1].sc, W / 2, H / 2 + 42);
    }
  }

  return {
    id: 'duelFruit', name: '搶水果',
    mount() { $('mini').classList.add('on'); $('s1').textContent = '0'; $('s2').textContent = '0'; },
    unmount() { $('mini').classList.remove('on'); },
    onDir() {},
    update(dt) { step(dt); draw(); },
    allDead: () => over,
    scores: () => [P[0].sc, P[1].sc],
    detail: () => `P1　${P[0].sc} 分　｜　P2　${P[1].sc} 分`,
  };
}

/* =========================== 搶地盤塗色（splat） ===========================
   網格上走動染成自己的顏色，時間到比誰染得多。吃到「變大」道具一次染 2×2。 */
function createDuelSplat() {
  const stage = $('miniStage'); stage.innerHTML = '';
  const COLS = 15, ROWS = 9, CELL = 44, TIME = 30;
  const W = COLS * CELL, H = ROWS * CELL;
  const cv = document.createElement('canvas');
  cv.width = W * CANVAS_SS; cv.height = H * CANVAS_SS;
  cv.style.cssText = 'display:block;max-width:96vw;max-height:78vh;width:auto;height:auto;border-radius:12px;box-shadow:0 14px 48px rgba(0,0,0,.65)';
  stage.appendChild(cv);
  const g = cv.getContext('2d'); g.scale(CANVAS_SS, CANVAS_SS);
  const grid = new Uint8Array(COLS * ROWS);      // 0 空、1 P1、2 P2
  const P = [
    { x: 0, y: 0, big: 0, col: '#ff6b6b' },
    { x: COLS - 1, y: ROWS - 1, big: 0, col: '#5aa9ff' },
  ];
  const prop = { x: 7, y: 4, t: 0 };              // 變大道具位置
  let time = TIME, over = false, winner = -1;

  function paint(pi) {
    const p = P[pi], n = p.big > 0 ? 2 : 1;
    for (let dy = 0; dy < n; dy++) for (let dx = 0; dx < n; dx++) {
      const cx = p.x + dx, cy = p.y + dy;
      if (cx < COLS && cy < ROWS) grid[cy * COLS + cx] = pi + 1;
    }
  }
  function step(dt) {
    if (over) return;
    time -= dt;
    P.forEach((p) => { if (p.big > 0) p.big -= dt; });
    if (time <= 0) {
      over = true;
      const c1 = grid.reduce((a, v) => a + (v === 1 ? 1 : 0), 0);
      const c2 = grid.reduce((a, v) => a + (v === 2 ? 1 : 0), 0);
      winner = c1 === c2 ? -1 : (c1 > c2 ? 0 : 1);
    }
  }
  function draw() {
    for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) {
      const v = grid[r * COLS + c];
      g.fillStyle = v === 0 ? '#1c2733' : (v === 1 ? '#ff6b6b' : '#5aa9ff');
      g.fillRect(c * CELL + 2, r * CELL + 2, CELL - 4, CELL - 4);
    }
    g.font = '40px system-ui'; g.textAlign = 'center'; g.textBaseline = 'middle';
    g.fillText('💥', prop.x * CELL + CELL / 2, prop.y * CELL + CELL / 2);   // 變大道具
    g.textAlign = 'start'; g.textBaseline = 'alphabetic';
    P.forEach((p, pi) => {
      const r = p.big > 0 ? 20 : 15;
      g.fillStyle = p.col; g.beginPath();
      g.arc(p.x * CELL + CELL / 2, p.y * CELL + CELL / 2, r, 0, Math.PI * 2); g.fill();
      g.strokeStyle = '#fff'; g.lineWidth = 3; g.stroke();
    });
    const c1 = grid.reduce((a, v) => a + (v === 1 ? 1 : 0), 0);
    const c2 = grid.reduce((a, v) => a + (v === 2 ? 1 : 0), 0);
    g.fillStyle = '#fff'; g.font = 'bold 22px system-ui';
    g.fillText('P1 ' + c1 + ' ｜ P2 ' + c2 + ' ｜ ⏱ ' + Math.max(0, Math.ceil(time)), 12, H - 12);
    if (over) {
      g.fillStyle = 'rgba(6,9,14,.66)'; g.fillRect(0, 0, W, H);
      g.fillStyle = '#fff'; g.font = 'bold 44px system-ui'; g.textAlign = 'center';
      g.fillText(winner < 0 ? '平手！' : (winner === 0 ? 'P1 紅 勝' : 'P2 藍 勝'), W / 2, H / 2);
      g.textAlign = 'start';
    }
  }

  return {
    id: 'duelSplat', name: '搶地盤塗色',
    mount() { $('mini').classList.add('on'); },
    unmount() { $('mini').classList.remove('on'); },
    onDir(i, d) {
      const p = P[i];
      const nx = p.x + (d === 'left' ? -1 : d === 'right' ? 1 : 0);
      const ny = p.y + (d === 'up' ? -1 : d === 'down' ? 1 : 0);
      if (nx < 0 || nx >= COLS || ny < 0 || ny >= ROWS) return;
      p.x = nx; p.y = ny;
      if (p.x === prop.x && p.y === prop.y) {
        p.big = 6; blip(760, 0.1, 0.08);
        prop.x = (rng() * COLS) | 0; prop.y = (rng() * ROWS) | 0;
      }
      paint(i); blip(300 + i * 80, 0.03, 0.03);
    },
    update(dt) { step(dt); draw(); },
    allDead: () => over,
    scores: () => {
      const c1 = grid.reduce((a, v) => a + (v === 1 ? 1 : 0), 0);
      const c2 = grid.reduce((a, v) => a + (v === 2 ? 1 : 0), 0);
      return [c1, c2];
    },
    detail() {
      const c1 = grid.reduce((a, v) => a + (v === 1 ? 1 : 0), 0);
      const c2 = grid.reduce((a, v) => a + (v === 2 ? 1 : 0), 0);
      return `P1 塗 ${c1} 格　｜　P2 塗 ${c2} 格`;
    },
  };
}

/* =========================== 翻牌配對（memory） ===========================
   4×4 共 16 張（8 對），輪流翻兩張，配對成功得分並再翻，失敗換人。 */
function createDuelMemory() {
  const stage = $('miniStage'); stage.innerHTML = '';
  const N = 16, COLS = 4, CELL = 90, GAP = 12;
  const W = COLS * CELL + GAP * 5, H = 4 * CELL + GAP * 5;
  const cv = document.createElement('canvas');
  cv.width = W * CANVAS_SS; cv.height = H * CANVAS_SS;
  cv.style.cssText = 'display:block;max-width:96vw;max-height:78vh;width:auto;height:auto;border-radius:12px;box-shadow:0 14px 48px rgba(0,0,0,.65)';
  stage.appendChild(cv);
  const g = cv.getContext('2d'); g.scale(CANVAS_SS, CANVAS_SS);
  const EMO = ['🍎', '🍌', '🍇', '🍊', '🍉', '🐷', '🐱', '⭐'];
  const cards = [];               // {emo, flipped, gone}
  for (let i = 0; i < N / 2; i++) { cards.push({ emo: EMO[i] }); cards.push({ emo: EMO[i] }); }
  for (let i = cards.length - 1; i > 0; i--) { const j = (rng() * (i + 1)) | 0; [cards[i], cards[j]] = [cards[j], cards[i]]; }
  cards.forEach(c => { c.flipped = false; c.gone = false; });
  const P = [
    { x: 0, y: 0, sc: 0 },
    { x: COLS - 1, y: 3, sc: 0 },
  ];
  let turn = 0, first = -1, second = -1, lock = false, lockT = 0, matchedPair = null, over = false, winner = -1;
  const MATCH_HOLD = 1.0;         // 配對成功後保持翻開的時間（秒），時間到才消失

  const idx = (x, y) => y * COLS + x;
  const cx = (i) => GAP + (i % COLS) * (CELL + GAP) + CELL / 2;
  const cy = (i) => GAP + ((i / COLS) | 0) * (CELL + GAP) + CELL / 2;

  function flip(i) {
    if (lock || cards[i].flipped || cards[i].gone) return;
    cards[i].flipped = true;
    if (first < 0) { first = i; blip(500, 0.05, 0.05); return; }
    second = i;
    if (cards[first].emo === cards[i].emo) {
      // 配對成功：先讓兩張保持翻開，等 MATCH_HOLD 秒後才消失（不要一配對就突然不見）
      matchedPair = [first, second];
      P[turn].sc++; blip(900, 0.1, 0.08);
      lock = true; lockT = MATCH_HOLD;
      first = second = -1;
    } else {
      lock = true; lockT = 0.8; blip(220, 0.08, 0.05);
    }
  }
  function step(dt) {
    if (over) return;
    if (lock) {
      lockT -= dt;
      if (lockT <= 0) {
        if (matchedPair) {
          // 配對成功的那兩張：保持翻開的時間到了，現在才讓它們消失
          cards[matchedPair[0]].gone = cards[matchedPair[1]].gone = true;
          cards[matchedPair[0]].flipped = cards[matchedPair[1]].flipped = false;
          matchedPair = null;
        } else {
          cards[first].flipped = false; cards[second].flipped = false;
          first = second = -1; turn = 1 - turn;
        }
        lock = false;
      }
    }
    if (cards.every(c => c.gone)) { over = true; winner = P[0].sc === P[1].sc ? -1 : (P[0].sc > P[1].sc ? 0 : 1); }
  }
  function draw() {
    g.fillStyle = '#14222e'; g.fillRect(0, 0, W, H);
    cards.forEach((c, i) => {
      const x = GAP + (i % COLS) * (CELL + GAP), y = GAP + ((i / COLS) | 0) * (CELL + GAP);
      if (c.gone) { g.fillStyle = 'rgba(255,255,255,.06)'; g.fillRect(x, y, CELL, CELL); return; }
      g.fillStyle = c.flipped ? '#f2e6d8' : '#3a4b5c';
      g.fillRect(x, y, CELL, CELL);
      g.strokeStyle = '#1a2129'; g.lineWidth = 3; g.strokeRect(x, y, CELL, CELL);
      if (c.flipped) { g.font = '50px system-ui'; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText(c.emo, x + CELL / 2, y + CELL / 2 + 4); g.textAlign = 'start'; g.textBaseline = 'alphabetic'; }
      else { g.font = 'bold 34px system-ui'; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillStyle = '#7f96ab'; g.fillText('?', x + CELL / 2, y + CELL / 2 + 3); g.textAlign = 'start'; g.textBaseline = 'alphabetic'; }
    });
    P.forEach((p, i) => {
      const ci = idx(p.x, p.y);
      const bx = GAP + (ci % COLS) * (CELL + GAP), by = GAP + ((ci / COLS) | 0) * (CELL + GAP);
      g.strokeStyle = i === 0 ? '#ff6b6b' : '#5aa9ff';
      g.lineWidth = 4; g.strokeRect(bx - 4, by - 4, CELL + 8, CELL + 8);
    });
    g.fillStyle = '#fff'; g.font = 'bold 24px system-ui';
    g.fillText(`P1 ${P[0].sc} ｜ P2 ${P[1].sc}　${turn === 0 ? '← P1 回合' : 'P2 回合 →'}`, 14, H - 12);
    if (over) {
      g.fillStyle = 'rgba(6,9,14,.66)'; g.fillRect(0, 0, W, H);
      g.fillStyle = '#fff'; g.font = 'bold 44px system-ui'; g.textAlign = 'center';
      g.fillText(winner < 0 ? '平手！' : (winner === 0 ? 'P1 紅 勝' : 'P2 藍 勝'), W / 2, H / 2);
      g.textAlign = 'start';
    }
  }

  return {
    id: 'duelMemory', name: '翻牌配對',
    mount() { $('mini').classList.add('on'); $('s1').textContent = '0'; $('s2').textContent = '0'; },
    unmount() { $('mini').classList.remove('on'); },
    onDir(i, d) { if (i !== turn) return; const p = P[i]; const nx = p.x + (d === 'left' ? -1 : d === 'right' ? 1 : 0); const ny = p.y + (d === 'up' ? -1 : d === 'down' ? 1 : 0); if (nx >= 0 && nx < COLS && ny >= 0 && ny < 4) { p.x = nx; p.y = ny; } },
    onConfirm(i) { if (i !== turn) return; flip(idx(P[i].x, P[i].y)); },
    update(dt) { step(dt); draw(); },
    allDead: () => over,
    scores: () => [P[0].sc, P[1].sc],
    detail: () => `P1　${P[0].sc} 對　｜　P2　${P[1].sc} 對`,
  };
}

/* =========================== 拔河（tug of war） ===========================
   比照正式拔河：畫面正中一條固定的「正中線」，兩側各距 MAX 處有己方的
   「勝利線」（P1 紅、P2 藍）。把繩子中央的紅色標記拉過自己那條勝利線就贏。 */
function createDuelTug() {
  const stage = $('miniStage'); stage.innerHTML = '';
  const W = 960, H = 540, CY = H / 2, MAX = 230;
  const cv = document.createElement('canvas');
  cv.width = W * CANVAS_SS; cv.height = H * CANVAS_SS;
  cv.style.cssText = 'display:block;max-width:96vw;max-height:78vh;width:auto;height:auto;border-radius:12px;box-shadow:0 14px 48px rgba(0,0,0,.65)';
  stage.appendChild(cv);
  const g = cv.getContext('2d'); g.scale(CANVAS_SS, CANVAS_SS);
  let rope = 0, over = false, winner = -1;

  function pull(i) {
    if (over) return;
    rope += (i === 0 ? -7 : 7);
    blip(360 + i * 120, 0.03, 0.04);
    if (rope <= -MAX) { over = true; winner = 0; }
    else if (rope >= MAX) { over = true; winner = 1; }
  }
  function draw() {
    g.fillStyle = '#14222e'; g.fillRect(0, 0, W, H);
    // 兩側勝利線（固定；P1 紅、P2 藍）：紅標越過自己那條就贏
    g.lineWidth = 5; g.setLineDash([12, 10]);
    g.strokeStyle = '#ff6b6b'; g.beginPath(); g.moveTo(W / 2 - MAX, 56); g.lineTo(W / 2 - MAX, H - 56); g.stroke();
    g.strokeStyle = '#5aa9ff'; g.beginPath(); g.moveTo(W / 2 + MAX, 56); g.lineTo(W / 2 + MAX, H - 56); g.stroke();
    g.setLineDash([]);
    // 正中線（固定，白實線）
    g.strokeStyle = '#eef3f9'; g.lineWidth = 5;
    g.beginPath(); g.moveTo(W / 2, 40); g.lineTo(W / 2, H - 40); g.stroke();
    g.fillStyle = '#2c3e50'; g.fillRect(0, CY + 70, W, 22);                 // 地面
    g.strokeStyle = '#c9a24a'; g.lineWidth = 12;
    g.beginPath(); g.moveTo(0, CY); g.lineTo(W, CY); g.stroke();            // 繩子
    // 繩子中央的紅色標記（＝繩子的正中），隨繩移動
    const bandX = W / 2 + rope;
    g.fillStyle = '#e74c3c'; g.beginPath(); g.arc(bandX, CY, 20, 0, Math.PI * 2); g.fill();
    g.strokeStyle = '#fff'; g.lineWidth = 3; g.beginPath(); g.arc(bandX, CY, 20, 0, Math.PI * 2); g.stroke();
    // 兩個小人（圓頭＋身體）
    for (let i = 0; i < 2; i++) {
      const x = i === 0 ? 120 + rope : W - 120 + rope;
      g.fillStyle = i === 0 ? '#ff6b6b' : '#5aa9ff';
      g.beginPath(); g.arc(x, CY - 46, 24, 0, Math.PI * 2); g.fill();      // 頭
      g.fillRect(x - 20, CY - 18, 40, 88);                                  // 身體
      g.fillStyle = '#3a2818'; g.fillRect(x - 22, CY + 70, 44, 22);         // 鞋
    }
    g.fillStyle = 'rgba(255,255,255,.7)'; g.font = 'bold 22px system-ui';
    g.fillText('狂按任意鍵拉！把紅標拉過自己那條線就贏', 12, 32);
    if (over) {
      g.fillStyle = 'rgba(6,9,14,.66)'; g.fillRect(0, 0, W, H);
      g.fillStyle = '#fff'; g.font = 'bold 48px system-ui'; g.textAlign = 'center';
      g.fillText(winner === 0 ? 'P1 紅 勝！' : 'P2 藍 勝！', W / 2, H / 2); g.textAlign = 'start';
    }
  }

  return {
    id: 'duelTug', name: '拔河',
    mount() { $('mini').classList.add('on'); },
    unmount() { $('mini').classList.remove('on'); },
    onDir(i) { pull(i); },
    onConfirm(i) { pull(i); },
    update() { draw(); },
    allDead: () => over,
    scores: () => [winner === 0 ? 1 : 0, winner === 1 ? 1 : 0],
    detail: () => (winner < 0 ? '平手' : (winner === 0 ? 'P1 紅 勝' : 'P2 藍 勝')),
  };
}

/* =========================== 障礙賽跑（obstacle race） ===========================
   連打左右鍵前進，跳躍鍵（W／↑）跳過柵欄。碰到柵欄會被彈回。先到終點勝。 */
function createDuelRace() {
  const stage = $('miniStage'); stage.innerHTML = '';
  const W = 960, H = 540, GY = H - 70, FIN = W - 70;
  const cv = document.createElement('canvas');
  cv.width = W * CANVAS_SS; cv.height = H * CANVAS_SS;
  cv.style.cssText = 'display:block;max-width:96vw;max-height:78vh;width:auto;height:auto;border-radius:12px;box-shadow:0 14px 48px rgba(0,0,0,.65)';
  stage.appendChild(cv);
  const g = cv.getContext('2d'); g.scale(CANVAS_SS, CANVAS_SS);
  const GAC = 2600, JUMP = 820;
  const P = [
    { x: 60, y: 170, vy: 0, onGround: true, col: '#ff6b6b', ground: 170 },
    { x: 60, y: 360, vy: 0, onGround: true, col: '#5aa9ff', ground: 360 },
  ];
  const hurdles = [250, 430, 610, 780].map(x => ({ x }));
  let over = false, winner = -1;

  function step(dt) {
    if (over) return;
    P.forEach((p) => {
      if (!p.onGround) { p.vy += GAC * dt; p.y += p.vy * dt; if (p.y >= p.ground) { p.y = p.ground; p.vy = 0; p.onGround = true; } }
    });
    // 撞柵欄（沒跳夠高就彈回）
    P.forEach((p) => {
      for (const h of hurdles) {
        if (Math.abs(p.x - h.x) < 22 && (p.ground - p.y) < 60) { p.x -= 60; blip(180, 0.1, 0.06); }
      }
    });
    P.forEach((p, pi) => { if (p.x >= FIN) { over = true; winner = pi; } });
  }
  function draw() {
    g.fillStyle = '#14222e'; g.fillRect(0, 0, W, H);
    P.forEach((p) => { g.fillStyle = '#22303f'; g.fillRect(0, p.ground + 60, W, 8); });   // 兩條跑道
    g.fillStyle = '#f5c542'; g.fillRect(FIN, 60, 10, H - 130);               // 終點線
    g.fillStyle = 'rgba(255,255,255,.6)'; g.font = 'bold 20px system-ui'; g.fillText('🏁', FIN - 6, 50);
    for (const h of hurdles) {
      g.fillStyle = '#e67e22';
      P.forEach((p) => { g.fillRect(h.x - 8, p.ground + 60 - 78, 16, 78); });   // 兩條跑道各一根
    }
    P.forEach((p) => {
      g.fillStyle = p.col; g.beginPath(); g.arc(p.x, p.y, 20, 0, Math.PI * 2); g.fill();
      g.fillRect(p.x - 16, p.y + 18, 32, 50);
    });
    g.fillStyle = '#fff'; g.font = 'bold 20px system-ui';
    g.fillText('連打左右前進 · W／↑ 跳過柵欄', 12, 30);
    if (over) {
      g.fillStyle = 'rgba(6,9,14,.66)'; g.fillRect(0, 0, W, H);
      g.fillStyle = '#fff'; g.font = 'bold 48px system-ui'; g.textAlign = 'center';
      g.fillText(winner === 0 ? 'P1 紅 勝！' : 'P2 藍 勝！', W / 2, H / 2); g.textAlign = 'start';
    }
  }

  return {
    id: 'duelRace', name: '障礙賽跑',
    mount() { $('mini').classList.add('on'); },
    unmount() { $('mini').classList.remove('on'); },
    onDir(i, d) {
      const p = P[i];
      if (d === 'up') { if (p.onGround) { p.vy = -JUMP; p.onGround = false; blip(600, 0.05, 0.05); } return; }
      if (d === 'left' || d === 'right') { p.x += 22; }
    },
    update(dt) { step(dt); draw(); },
    allDead: () => over,
    scores: () => [winner === 0 ? 1 : 0, winner === 1 ? 1 : 0],
    detail: () => (winner === 0 ? 'P1 紅 先到終點' : 'P2 藍 先到終點'),
  };
}

/* =========================== 答題爬格子（math climb） ===========================
   輪流丟骰子前進，然後答一題數學（四選一，對應上下左右）。答對照骰子前進，答錯後退一步。
   先到終點勝。難度用網址參數 ?math=easy|medium|hard（預設 easy）。 */
function createDuelMathClimb() {
  const stage = $('miniStage'); stage.innerHTML = '';
  const COLS = 4, ROWS = 6, CELL = 70, N = COLS * ROWS;
  const W = COLS * CELL + 80, H = ROWS * CELL + 200;
  const cv = document.createElement('canvas');
  cv.width = W * CANVAS_SS; cv.height = H * CANVAS_SS;
  cv.style.cssText = 'display:block;max-width:96vw;max-height:78vh;width:auto;height:auto;border-radius:12px;box-shadow:0 14px 48px rgba(0,0,0,.65)';
  stage.appendChild(cv);
  const g = cv.getContext('2d'); g.scale(CANVAS_SS, CANVAS_SS);
  const MODE = (new URLSearchParams(location.search).get('math') || 'easy').toLowerCase();
  const pos = [0, 0];                 // 兩個棋子位置（格 index）
  let turn = 0, phase = 'roll', dice = 0, over = false, winner = -1;
  let q = null, opts = [];

  const cellXY = (i) => {
    const r = (i / COLS) | 0, c = i % COLS;
    const col = (r % 2 === 0) ? c : (COLS - 1 - c);
    return { x: 40 + col * CELL + CELL / 2, y: 40 + r * CELL + CELL / 2 };
  };
  function genQ() {
    let a, b, op, ans;
    if (MODE === 'medium') {
      a = 10 + ((rng() * 90) | 0); b = 10 + ((rng() * 90) | 0);
      if (rng() < 0.5) { op = '+'; ans = a + b; } else { if (a < b) [a, b] = [b, a]; op = '−'; ans = a - b; }
    } else if (MODE === 'hard') {
      a = 11 + ((rng() * 89) | 0); b = 11 + ((rng() * 89) | 0); op = '×'; ans = a * b;
    } else {
      a = 1 + ((rng() * 10) | 0); b = 1 + ((rng() * 10) | 0);
      if (rng() < 0.5) { op = '+'; ans = a + b; } else { if (a < b) [a, b] = [b, a]; op = '−'; ans = a - b; }
    }
    const s = new Set([ans]);
    while (s.size < 4) { s.add(ans + ((rng() * 21) | 0) - 10); }
    opts = [...s].sort(() => rng() - 0.5);
    q = { a, b, op, ans };
  }
  function roll() {
    dice = 1 + ((rng() * 6) | 0); phase = 'question'; genQ(); blip(700, 0.08, 0.06);
  }
  function answer(dir) {
    if (phase !== 'question') return;
    const pick = opts[dir];            // dir: up=0 down=1 left=2 right=3
    if (pick === q.ans) {
      pos[turn] = Math.min(N - 1, pos[turn] + dice);
      blip(900, 0.1, 0.08);
    } else {
      pos[turn] = Math.max(0, pos[turn] - 1);
      blip(200, 0.1, 0.05);
    }
    if (pos[turn] >= N - 1) { over = true; winner = turn; return; }
    turn = 1 - turn; phase = 'roll'; dice = 0; q = null;
  }
  function draw() {
    g.fillStyle = '#14222e'; g.fillRect(0, 0, W, H);
    // 蛇形格子
    for (let i = 0; i < N; i++) {
      const p = cellXY(i);
      g.fillStyle = (i % 2 === 0) ? '#22303f' : '#1c2834';
      g.fillRect(p.x - CELL / 2 + 2, p.y - CELL / 2 + 2, CELL - 4, CELL - 4);
      g.strokeStyle = '#3a4b5c'; g.lineWidth = 2; g.strokeRect(p.x - CELL / 2, p.y - CELL / 2, CELL, CELL);
      if (i === N - 1) { g.fillStyle = '#f5c542'; g.font = '30px system-ui'; g.textAlign = 'center'; g.fillText('🏁', p.x, p.y + 10); g.textAlign = 'start'; }
    }
    for (let i = 0; i < 2; i++) {
      const p = cellXY(pos[i]);
      g.fillStyle = i === 0 ? '#ff6b6b' : '#5aa9ff'; g.beginPath();
      g.arc(p.x + (i === 0 ? -14 : 14), p.y, 16, 0, Math.PI * 2); g.fill();
      g.strokeStyle = '#fff'; g.lineWidth = 2; g.stroke();
    }
    // 題目區
    const qy = ROWS * CELL + 70;
    if (phase === 'roll') {
      g.fillStyle = '#fff'; g.font = 'bold 26px system-ui'; g.textAlign = 'center';
      g.fillText(`${turn === 0 ? 'P1 紅' : 'P2 藍'} 回合 — 按確認鍵丟骰子`, W / 2, qy + 10);
      g.textAlign = 'start';
    } else if (phase === 'question' && q) {
      g.fillStyle = '#f2e6d8'; g.fillRect(W / 2 - 160, qy - 36, 320, 76);
      g.fillStyle = '#14222e'; g.font = 'bold 34px system-ui'; g.textAlign = 'center';
      g.fillText(`${q.a} ${q.op} ${q.b} = ?`, W / 2, qy + 16);
      g.textAlign = 'start';
      const dirs = [['↑', 0, -1], ['↓', 0, 1], ['←', -1, 0], ['→', 1, 0]];
      g.font = 'bold 22px system-ui';
      dirs.forEach((d, k) => {
        const ox = W / 2 + d[1] * 150, oy = qy + 50 + d[2] * 40;
        g.fillStyle = '#3a4b5c'; g.beginPath(); g.arc(ox, oy, 30, 0, Math.PI * 2); g.fill();
        g.fillStyle = '#fff'; g.textAlign = 'center';
        g.fillText(d[0] + ' ' + opts[k], ox, oy + 8); g.textAlign = 'start';
      });
    }
    if (over) {
      g.fillStyle = 'rgba(6,9,14,.66)'; g.fillRect(0, 0, W, H);
      g.fillStyle = '#fff'; g.font = 'bold 44px system-ui'; g.textAlign = 'center';
      g.fillText(winner === 0 ? 'P1 紅 勝！' : 'P2 藍 勝！', W / 2, H / 2); g.textAlign = 'start';
    }
  }

  return {
    id: 'duelMath', name: '答題爬格子',
    mount() { $('mini').classList.add('on'); },
    unmount() { $('mini').classList.remove('on'); },
    onDir(i, d) { if (i !== turn) return; const m = { up: 0, down: 1, left: 2, right: 3 }; if (phase === 'question') answer(m[d]); },
    onConfirm(i) { if (i !== turn) return; if (phase === 'roll') roll(); },
    update() { draw(); },
    allDead: () => over,
    scores: () => [winner === 0 ? 1 : 0, winner === 1 ? 1 : 0],
    detail: () => (MODE === 'hard' ? '難度：兩位數乘法' : MODE === 'medium' ? '難度：兩位數加減' : '難度：10 以內加減'),
  };
}
