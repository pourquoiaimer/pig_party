/* =========================== 2048 對戰小遊戲 =========================== */
function createDuel2048() {
  const root = $('mini');
  const boardsEl = $('miniStage');
  const CELL = Math.max(44, Math.min(innerWidth * 0.062, innerHeight * 0.115));
  const GAP = CELL * 0.115;
  const PAD = CELL * 0.115;
  const BOARD = CELL * 4 + GAP * 3 + PAD * 2;

  const state = [0, 1].map(() => {
    const g = gNew(rng);
    return { game:g, tiles:new Map(), nextId:1, dead:false };
  });

  boardsEl.innerHTML = '';
  const views = state.map((s, i) => {
    const wrap = document.createElement('div');
    wrap.className = 'boardWrap';

    const board = document.createElement('div');
    board.className = 'board';
    board.style.width = BOARD + 'px';
    board.style.height = BOARD + 'px';

    for (let r = 0; r < 4; r++) for (let c = 0; c < 4; c++) {
      const bc = document.createElement('div');
      bc.className = 'bgCell';
      bc.style.width = CELL + 'px'; bc.style.height = CELL + 'px';
      bc.style.left = (PAD + c * (CELL + GAP)) + 'px';
      bc.style.top  = (PAD + r * (CELL + GAP)) + 'px';
      board.appendChild(bc);
    }
    const dead = document.createElement('div');
    dead.className = 'dead'; dead.textContent = '死局';
    board.appendChild(dead);

    wrap.appendChild(board);
    boardsEl.appendChild(wrap);

    const v = { wrap, board, dead, s };
    // 初始兩格
    s.game.grid.forEach((val, idx) => {
      if (!val) return;
      const t = placeTile(v, idx, val, true);
      setTimeout(() => t.el.classList.remove('spawn'), 220);
    });
    return v;
  });

  function xy(idx) {
    const r = Math.floor(idx / 4), c = idx % 4;
    return { x: PAD + c * (CELL + GAP), y: PAD + r * (CELL + GAP) };
  }

  function placeTile(v, idx, val, isNew) {
    const id = v.s.nextId++;
    const el = document.createElement('div');
    el.className = 'tile' + (isNew ? ' spawn' : '');
    el.style.width = CELL + 'px'; el.style.height = CELL + 'px';
    el.style.transform = `translate(${xy(idx).x}px,${xy(idx).y}px)`;
    const st = tileFont(val, CELL);
    el.style.background = tileColor(val);
    el.style.color = st.color; el.style.fontSize = st.fontSize;
    el.innerHTML = `<span class="v">${val}</span>`;
    v.board.appendChild(el);
    const t = { id, val, el, idx };
    v.s.tiles.set(id, t);
    return t;
  }

  function moveTile(t, idx) { t.idx = idx; t.el.style.transform = `translate(${xy(idx).x}px,${xy(idx).y}px)`; }

  function paint(t) {
    const st = tileFont(t.val, CELL);
    t.el.style.background = tileColor(t.val);
    t.el.style.color = st.color; t.el.style.fontSize = st.fontSize;
    t.el.firstChild.textContent = t.val;
    t.el.classList.add('pop');
    setTimeout(() => t.el.classList.remove('pop'), 100);
  }

  /** 依「追蹤版本」重算某一條線：回傳每個落點 {keepId, lostId, val, merged} 或 null */
  function resolveLine(line, dir) {
    // line: [{id,val}|null] × 4，index 0 ＝ 推往方向
    const items = line.filter(Boolean);
    const out = [];
    for (let i = 0; i < items.length; i++) {
      if (i + 1 < items.length && items[i].val === items[i + 1].val) {
        out.push({ keepId: items[i].id, lostId: items[i + 1].id, val: items[i].val * 2, merged: true });
        i++;
      } else {
        out.push({ keepId: items[i].id, lostId: null, val: items[i].val, merged: false });
      }
    }
    while (out.length < 4) out.push(null);
    return out;
  }

  function applyMove(v, dir) {
    const s = v.s;
    if (s.dead) return false;
    const res = gStep(s.game, dir, rng);
    if (!res.moved) return false;

    // 動畫：以 tile 身分追蹤
    const lines = gLines(dir);
    for (const idxs of lines) {
      const line = idxs.map(i => {
        let found = null;
        for (const t of s.tiles.values()) {
          if (t.idx === i) { found = t; break; }
        }
        return found ? { id: found.id, val: found.val } : null;
      });
      const resolved = resolveLine(line, dir);
      for (let k = 0; k < 4; k++) {
        const gi = idxs[k], cell = resolved[k];
        if (!cell) continue;
        const keep = s.tiles.get(cell.keepId);
        if (!keep) continue;
        moveTile(keep, gi);
        if (cell.merged) {
          const lost = s.tiles.get(cell.lostId);
          if (lost) {
            moveTile(lost, gi);
            s.tiles.delete(cell.lostId);
            setTimeout(() => lost.el.remove(), 120);
          }
          keep.val = cell.val;
          setTimeout(() => paint(keep), 110);
        }
      }
    }

    // 新生的格子
    if (res.spawned >= 0) {
      const val = s.game.grid[res.spawned];
      const t = placeTile(v, res.spawned, val, true);
      setTimeout(() => t.el.classList.remove('spawn'), 160);
    }

    $('s' + (v.index + 1)).textContent = s.game.score;
    if (res.over) {
      s.dead = true; v.dead.classList.add('on');
      v.wrap.classList.add('dim');
      $('st' + (v.index + 1)).textContent = '已死局';
      blip(180, 0.3, 0.10);
    } else {
      blip(520 + Math.min(res.gained, 64) * 4, 0.06, 0.05);
    }
    return true;
  }

  views.forEach((v, i) => { v.index = i; v.wrap._index = i; });

  return {
    id: 'duel2048',
    name: '2048 對戰',
    views, state,
    mount() {
      $('mini').classList.add('on');
      $('s1').textContent = '0'; $('s2').textContent = '0';
      $('st1').textContent = ''; $('st2').textContent = '';
      root.dataset.cell = CELL;
    },
    unmount() { $('mini').classList.remove('on'); },
    onDir(player, dir) { applyMove(views[player], dir); },
    allDead: () => state.every(s => s.dead),
    scores: () => state.map(s => s.game.score),
    detail: () => {
      const sc = state.map(s => s.game.score);
      const b  = state.map(s => { let m = 0; s.game.grid.forEach(v => { if (v > m) m = v; }); return m; });
      return `P1　${sc[0]} 分　最大方塊 ${b[0]}　｜　P2　${sc[1]} 分　最大方塊 ${b[1]}`;
    },
  };
}


/* =========================== 排球對戰（參考「皮卡丘打排球」的玩法） ===========================
   側視 1v1：中間一面網、重力球、碰到角色自動擊球、落地得分、先得 WIN_PTS 分者勝。
   角色＝程式繪製的原創簡單動物（P1 橘貓 / P2 藍蛙），不使用任何既有 IP 的角色。 */
function createDuelVolley() {
  const stage = $('miniStage');
  stage.innerHTML = '';

  const W = 960, H = 540;
  const GY = H - 48;                       // 地面（y 向下為正）
  const NET_X = W / 2, NET_W = 12, NET_TOP = GY - 176;
  const GAC = 1500;                        // 重力加速度
  const R = 19;                            // 球半徑（21:9 →調大一階）
  const PW = 74, PH = 84;                  // 角色尺寸
  const SPEED = 430, JUMP = 720;
  const WIN_PTS = 7;

  const cv = document.createElement('canvas');
  cv.width = W; cv.height = H;
  cv.style.cssText = 'display:block;width:min(90vw,76vh);height:auto;border-radius:12px;box-shadow:0 14px 48px rgba(0,0,0,.65)';
  stage.appendChild(cv);
  const g = cv.getContext('2d');

  const mk = (side) => ({ side, x: side < 0 ? W * 0.22 : W * 0.78, y: GY, vy: 0, onGround: true, blush: 0 });
  const P = [mk(-1), mk(1)];
  const ball = { x: W * 0.36, y: 150, vx: 0, vy: 0, live: false, cool: 0, trail: [] };
  const score = [0, 0];
  let over = false, serveT = 1.0, msg = '', msgT = 0, shake = 0, flashA = 0, rally = 0;

  function reset(serverIdx) {
    ball.x = serverIdx === 0 ? W * 0.36 : W * 0.64;
    ball.y = 150; ball.vx = 0; ball.vy = 0; ball.live = false; ball.cool = 0; ball.trail.length = 0;
    serveT = 1.0; rally = 0;
    P.forEach((p, i) => { p.x = i === 0 ? W * 0.22 : W * 0.78; p.y = GY; p.vy = 0; p.onGround = true; p.blush = 0; });
    $('st1').textContent = serverIdx === 0 ? '發球' : '';
    $('st2').textContent = serverIdx === 1 ? '發球' : '';
  }

  function point(who) {
    score[who]++;
    $('s' + (who + 1)).textContent = score[who];
    flashA = 1; shake = 12;
    blip(who === 0 ? 820 : 560, 0.18, 0.13);
    const nm = who === 0 ? 'P1 紅' : 'P2 藍';
    if (score[who] >= WIN_PTS) {
      over = true; msg = nm + ' 拿下這局！';
      $('miniBottom').innerHTML = msg;
      return;
    }
    msg = nm + ' 得分　' + score[0] + ' : ' + score[1]; msgT = 1.4;
    reset(who);
  }

  function step(dt) {
    if (over) return;
    if (msgT > 0) msgT -= dt;
    if (shake > 0) shake = Math.max(0, shake - 70 * dt);
    if (flashA > 0) flashA = Math.max(0, flashA - 2.6 * dt);

    P.forEach((p, i) => {
      const h = HELD[i];
      p.x += ((h.right ? 1 : 0) - (h.left ? 1 : 0)) * SPEED * dt;
      const lo = i === 0 ? PW / 2 + 8 : NET_X + NET_W / 2 + PW / 2;
      const hi = i === 0 ? NET_X - NET_W / 2 - PW / 2 : W - PW / 2 - 8;
      p.x = Math.max(lo, Math.min(hi, p.x));
      if (h.up && p.onGround) { p.vy = -JUMP; p.onGround = false; }
      if (!p.onGround) {
        p.vy += GAC * dt; p.y += p.vy * dt;
        if (p.y >= GY) { p.y = GY; p.vy = 0; p.onGround = true; }
      }
      if (p.blush > 0) p.blush -= dt;
    });

    if (!ball.live) { serveT -= dt; if (serveT <= 0) { ball.live = true; ball.vy = 60; } return; }

    ball.vy += GAC * 0.62 * dt;
    ball.x += ball.vx * dt;
    ball.y += ball.vy * dt;
    if (ball.cool > 0) ball.cool -= dt;
    ball.trail.push({ x: ball.x, y: ball.y });
    if (ball.trail.length > 14) ball.trail.shift();

    if (ball.x - R < 0)   { ball.x = R;     ball.vx =  Math.abs(ball.vx) * 0.86; }
    if (ball.x + R > W)   { ball.x = W - R; ball.vx = -Math.abs(ball.vx) * 0.86; }
    if (ball.y - R < 0)   { ball.y = R;     ball.vy =  Math.abs(ball.vy) * 0.86; }

    // 網子：球在網頂以下時不能穿過
    if (ball.y > NET_TOP && Math.abs(ball.x - NET_X) < NET_W / 2 + R) {
      if (ball.x < NET_X) { ball.x = NET_X - NET_W / 2 - R; ball.vx = -Math.abs(ball.vx) * 0.6; }
      else               { ball.x = NET_X + NET_W / 2 + R; ball.vx =  Math.abs(ball.vx) * 0.6; }
    }

    // 擊球（碰到角色就自動打回去）
    if (ball.cool <= 0) {
      for (let i = 0; i < 2; i++) {
        const p = P[i], cx = p.x, cy = p.y - PH * 0.55;
        if (Math.hypot(ball.x - cx, ball.y - cy) < R + 42) {
          const t = Math.max(-1, Math.min(1, (ball.x - cx) / 48));
          const toward = i === 0 ? 1 : -1;
          const mv = (HELD[i].right ? 1 : 0) - (HELD[i].left ? 1 : 0);
          ball.vx = toward * (350 + Math.abs(t) * 170) + t * 120 + mv * 80;
          ball.vy = -(545 + t * 80);
          ball.cool = 0.15;
          p.blush = 0.35; rally++;
          shake = 5; blip(900 + Math.min(rally, 12) * 28, 0.05, 0.06);
          break;
        }
      }
    }

    // 落地
    if (ball.y + R >= GY) { ball.y = GY - R; point(ball.x < NET_X ? 1 : 0); }
  }

  /* ---------- 繪圖 ---------- */
  function shadow(x, y, r) {
    g.save(); g.globalAlpha = 0.3; g.fillStyle = '#000';
    g.beginPath(); g.ellipse(x, y + 3, r, r * 0.3, 0, 0, Math.PI * 2); g.fill(); g.restore();
  }
  function drawCat(px, feetY, hitting) {          // P1 橘貓（面朝右）
    const cy = feetY - 40;
    shadow(px, feetY, 34);
    g.save(); g.translate(px, cy);
    g.strokeStyle = '#e08a34'; g.lineWidth = 9; g.lineCap = 'round';
    g.beginPath(); g.moveTo(-26, 16); g.quadraticCurveTo(-58, 10, -50, -26); g.stroke();
    g.fillStyle = '#f5a04a';
    g.beginPath(); g.ellipse(0, 0, 33, 38, 0, 0, Math.PI * 2); g.fill();
    g.beginPath(); g.moveTo(-24,-26); g.lineTo(-30,-52); g.lineTo(-7,-34); g.closePath(); g.fill();
    g.beginPath(); g.moveTo( 24,-26); g.lineTo( 30,-52); g.lineTo( 7,-34); g.closePath(); g.fill();
    g.fillStyle = '#ffe0bd';
    g.beginPath(); g.ellipse(3, 11, 20, 15, 0, 0, Math.PI * 2); g.fill();
    g.fillStyle = '#25292e';
    g.beginPath(); g.arc(-11,-4, 4.6, 0, Math.PI*2); g.fill();
    g.beginPath(); g.arc( 13,-4, 4.6, 0, Math.PI*2); g.fill();
    g.fillStyle = '#fff';
    g.beginPath(); g.arc(-9.5,-6, 1.6, 0, Math.PI*2); g.fill();
    g.beginPath(); g.arc( 14.5,-6, 1.6, 0, Math.PI*2); g.fill();
    g.fillStyle = '#e0725f';
    g.beginPath(); g.moveTo(-3,6); g.lineTo(5,6); g.lineTo(1,10); g.closePath(); g.fill();
    g.strokeStyle = 'rgba(255,255,255,.8)'; g.lineWidth = 1.6;
    [[-20,8,-38,3],[-20,13,-38,15]].forEach(a => { g.beginPath(); g.moveTo(a[0],a[1]); g.lineTo(a[2],a[3]); g.stroke(); });
    g.fillStyle = '#f5a04a';
    const ay = hitting ? -16 : 4;
    g.beginPath(); g.ellipse(31, ay, 9, 11.5, hitting ? -0.5 : 0, 0, Math.PI*2); g.fill();
    g.restore();
  }
  function drawFrog(px, feetY, hitting) {         // P2 藍蛙（面朝左）
    const cy = feetY - 38;
    shadow(px, feetY, 34);
    g.save(); g.translate(px, cy);
    g.fillStyle = '#4a93e0';
    g.beginPath(); g.ellipse(-20, 32, 13, 9, 0, 0, Math.PI*2); g.fill();
    g.beginPath(); g.ellipse( 20, 32, 13, 9, 0, 0, Math.PI*2); g.fill();
    g.fillStyle = '#5aa9ff';
    g.beginPath(); g.ellipse(0, 2, 34, 36, 0, 0, Math.PI*2); g.fill();
    g.fillStyle = '#cfe8ff';
    g.beginPath(); g.ellipse(-2, 14, 19, 16, 0, 0, Math.PI*2); g.fill();
    g.fillStyle = '#5aa9ff';
    g.beginPath(); g.arc(-15,-28, 13, 0, Math.PI*2); g.fill();
    g.beginPath(); g.arc( 13,-28, 13, 0, Math.PI*2); g.fill();
    g.fillStyle = '#fff';
    g.beginPath(); g.arc(-15,-29, 9, 0, Math.PI*2); g.fill();
    g.beginPath(); g.arc( 13,-29, 9, 0, Math.PI*2); g.fill();
    g.fillStyle = '#25292e';
    g.beginPath(); g.arc(-18,-27, 4.4, 0, Math.PI*2); g.fill();
    g.beginPath(); g.arc( 10,-27, 4.4, 0, Math.PI*2); g.fill();
    g.strokeStyle = '#2b6cb0'; g.lineWidth = 2.4;
    g.beginPath(); g.arc(-1, 4, 15, 0.28, Math.PI - 0.28); g.stroke();
    g.fillStyle = '#5aa9ff';
    const ay = hitting ? -16 : 4;
    g.beginPath(); g.ellipse(-31, ay, 9, 11.5, hitting ? 0.5 : 0, 0, Math.PI*2); g.fill();
    g.restore();
  }
  function drawBg() {
    const sky = g.createLinearGradient(0, 0, 0, H);
    sky.addColorStop(0, '#141b26'); sky.addColorStop(0.62, '#1d2735'); sky.addColorStop(1, '#243044');
    g.fillStyle = sky; g.fillRect(0, 0, W, H);
    g.fillStyle = 'rgba(255,255,255,.05)';
    for (let i = 0; i < 42; i++) { g.beginPath(); g.arc(16 + i * 23, 54 + (i % 3) * 17, 7, 0, Math.PI*2); g.fill(); }
    g.fillStyle = '#3a4a3c'; g.fillRect(0, GY, W, H - GY);
    g.fillStyle = 'rgba(255,255,255,.09)'; g.fillRect(0, GY, W, 3);
    g.fillStyle = '#8d9aa8'; g.fillRect(NET_X - NET_W/2, NET_TOP, NET_W, GY - NET_TOP);
    g.strokeStyle = 'rgba(232,240,250,.5)'; g.lineWidth = 1.2;
    for (let y = NET_TOP + 7; y < GY - 4; y += 11) { g.beginPath(); g.moveTo(NET_X - NET_W/2, y); g.lineTo(NET_X + NET_W/2, y); g.stroke(); }
    g.fillStyle = '#e8eef5'; g.fillRect(NET_X - 14, NET_TOP - 6, 28, 7);
    g.fillStyle = 'rgba(255,255,255,.14)'; g.fillRect(NET_X - 1, GY, 2, 30);
  }
  function drawBall() {
    for (let i = 0; i < ball.trail.length; i++) {
      const t = ball.trail[i], k = i / Math.max(1, ball.trail.length);
      g.globalAlpha = k * 0.32; g.fillStyle = '#ffe680';
      g.beginPath(); g.arc(t.x, t.y, R * (0.3 + k * 0.55), 0, Math.PI*2); g.fill();
    }
    g.globalAlpha = 1;
    const grd = g.createRadialGradient(ball.x - 5, ball.y - 6, 2, ball.x, ball.y, R);
    grd.addColorStop(0, '#fff8bd'); grd.addColorStop(0.62, '#ffd23f'); grd.addColorStop(1, '#dfa400');
    g.fillStyle = grd; g.beginPath(); g.arc(ball.x, ball.y, R, 0, Math.PI*2); g.fill();
    g.strokeStyle = 'rgba(120,88,0,.45)'; g.lineWidth = 1.6;
    g.beginPath(); g.arc(ball.x, ball.y, R, 0, Math.PI*2); g.stroke();
    g.fillStyle = 'rgba(255,255,255,.75)';
    g.beginPath(); g.arc(ball.x - 5, ball.y - 6, 4, 0, Math.PI*2); g.fill();
  }
  function draw() {
    g.setTransform(1, 0, 0, 1, 0, 0);
    g.textAlign = 'center';
    if (shake > 0) g.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
    drawBg();
    drawCat(P[0].x, P[0].y, ball.cool > 0.07);
    drawFrog(P[1].x, P[1].y, ball.cool > 0.07);
    drawBall();
    if (!ball.live && serveT > 0 && !over) {
      g.fillStyle = 'rgba(255,255,255,.85)'; g.font = 'bold 22px system-ui';
      g.fillText('準備發球…', W / 2, 96);
    }
    if (msgT > 0 && !over) {
      g.globalAlpha = Math.min(1, msgT); g.fillStyle = '#fff'; g.font = 'bold 34px system-ui';
      g.fillText(msg, W / 2, 112); g.globalAlpha = 1;
    }
    if (over) {
      g.fillStyle = 'rgba(6,9,14,.66)'; g.fillRect(0, 0, W, H);
      g.fillStyle = '#fff'; g.font = 'bold 44px system-ui';
      g.fillText(msg || '結束', W / 2, H / 2 - 8);
      g.fillStyle = '#9fd0ff'; g.font = 'bold 26px system-ui';
      g.fillText(score[0] + ' : ' + score[1], W / 2, H / 2 + 40);
    }
    if (flashA > 0) { g.fillStyle = 'rgba(255,255,255,' + (flashA * 0.3) + ')'; g.fillRect(0, 0, W, H); }
  }

  reset(0);
  return {
    id: 'duelVolley', name: '電氣鼠排球',
    mount() {
      $('mini').classList.add('on');
      $('s1').textContent = '0'; $('s2').textContent = '0';
      reset(0);
    },
    unmount() { $('mini').classList.remove('on'); },
    onDir() {},                                   // 運動型遊戲不用一格一動
    update(dt) { step(dt); draw(); },
    allDead: () => over,
    scores: () => score.slice(),
    detail: () => `P1　${score[0]} 分　｜　P2　${score[1]} 分`,
    refs: { ball, P },
  };
}

/* =========================== 橫版對戰小遊戲 ===========================
   側視 1v1。上＝攻擊、下＝防禦（按住）、左右移動。血量歸零就倒地。
   角色直接用大廳那兩隻 —— 所以變過頭的會用變過的頭打。
   注意：主迴圈會先把方向鍵的「邊緣觸發」吃掉再呼叫 update()，
        所以攻擊必須走 onDir() 介面，不能在 update() 裡讀 PRESSED。
   ====================================================================== */
function createDuelFight() {
  const MAXHP = 100, ATK_RANGE = 2.6, ATK_DUR = 0.45, ATK_COOL = 0.60;
  const SPEED = 7.6, HURT_T = 0.26, KNOCK_HIT = 1.25, KNOCK_GUARD = 0.35;
  const MIN_SEP = 1.15;          // 兩人最近距離（不能互相穿過）

  const S = {
    hp: [MAXHP, MAXHP],
    st: ['idle', 'idle'],          // idle | attack | hurt | dead  （block 由輸入即時決定）
    t: [0, 0], cool: [0, 0],
    hitDone: [false, false],
    over: false, winner: -1, deadT: 0,
  };
  const queued = [false, false];
  const sparks = [];

  /* 拳擊姿勢：肩 rotation.x（負 = 往前抬）與 肘 elbow.rotation.x
       放下 → 雙手自然垂在身側
       防禦 → 上臂微垂、前臂抬到臉前（拳擊護臉）
       攻擊 → 手臂打直往前（總角度 −1.57 = 水平指向對手） */
  const POSE = {
    down:  { sh: -0.12, el: -0.30 },
    guard: { sh: -0.35, el: -2.25 },
    punch: { sh: -1.30, el: -0.27 },
  };
  const lerp = (a, b, t) => a + (b - a) * t;
  const setArm = (pl, k, sh, el) => { pl.arms[k].rotation.x = sh; pl.arms[k].elbow.rotation.x = el; };
  // 哪隻手比較靠近相機：P1 面向 +x 是 arms[0]；P2 面向 −x 剛好相反
  const nearArm = (i) => (i === 0 ? 0 : 1);

  // 進場前的原位，離場要還原
  const home = players.map(p => ({ pos: p.group.position.clone(), face: p.facing }));

  function place() {
    players.forEach((p, i) => {
      p.group.position.set(ARENA_X + (i === 0 ? -3.4 : 3.4), 0, 0);
      p.group.rotation.set(0, i === 0 ? Math.PI / 2 : -Math.PI / 2, 0);
      p.facing = i === 0 ? Math.PI / 2 : -Math.PI / 2;
      p.walk = 0;
      p.group.rotation.x = 0;
      p.legs[0].rotation.x = p.legs[1].rotation.x = 0;
      p.arms.forEach(a => { a.rotation.x = 0; a.elbow.rotation.x = 0; });
      p.gloves.forEach(g => { g.visible = true; });      // 上場戴拳擊手套
    });
  }
  place();

  const clampX = (x) => Math.max(ARENA_X - ARENA_HALF, Math.min(ARENA_X + ARENA_HALF, x));

  function spark(x, y, color) {
    const m = new THREE.Mesh(new THREE.SphereGeometry(0.2, 10, 8),
      new THREE.MeshBasicMaterial({ color, transparent: true, opacity: 0.95 }));
    m.position.set(x, y, 0.25);
    scene.add(m);
    sparks.push({ m, t: 0 });
  }

  function drawTop() {
    for (let i = 0; i < 2; i++) {
      const pct = Math.round(S.hp[i] / MAXHP * 100);
      $('s' + (i + 1)).textContent = String(S.hp[i]);
      $('st' + (i + 1)).innerHTML = '<div class="hpb"><i class="' + (pct <= 30 ? 'low' : '') +
        '" style="width:' + pct + '%"></i></div>';
    }
  }

  function hit(i) {
    const o = 1 - i;
    if (S.over || S.st[o] === 'dead') return;
    const a = players[i].group.position.x, b = players[o].group.position.x;
    if (Math.abs(a - b) > ATK_RANGE) { blip(150, 0.05, 0.03); return; }    // 揮空
    const guarded = HELD[o].down;
    const dmg = guarded ? 4 : 14;
    S.hp[o] = Math.max(0, S.hp[o] - dmg);

    const dir = Math.sign(b - a) || 1;
    players[o].group.position.x = clampX(b + dir * (guarded ? KNOCK_GUARD : KNOCK_HIT));
    spark((a + b) / 2, 1.8, guarded ? 0x9ad8ff : 0xffd34d);
    if (guarded) { blip(430, 0.06, 0.06); blip(300, 0.09, 0.05); }
    else         { blip(175, 0.11, 0.09); }

    if (S.hp[o] <= 0) { S.st[o] = 'dead'; S.over = true; S.winner = i; S.deadT = 0; }
    else              { S.st[o] = 'hurt'; S.t[o] = HURT_T; }
    drawTop();
  }

  return {
    ownsScene: true,
    mount() { $('mini').classList.add('on'); activeCam = fcam; drawTop(); },
    unmount() {
      $('mini').classList.remove('on');
      $('mini').classList.remove('scene');
      activeCam = cam;
      players.forEach((p, i) => {
        p.group.position.copy(home[i].pos);
        p.group.rotation.set(0, home[i].face, 0);
        p.facing = home[i].face;
        p.walk = 0;
        p.legs[0].rotation.x = p.legs[1].rotation.x = 0;
        p.arms.forEach(a => { a.rotation.x = 0; a.elbow.rotation.x = 0; });
        p.gloves.forEach(g => { g.visible = false; });              // 脫下手套
      });
      for (const s of sparks) { scene.remove(s.m); s.m.geometry.dispose(); s.m.material.dispose(); }
      sparks.length = 0;
    },
    /** 主迴圈把方向鍵的邊緣觸發丟進來：上＝攻擊 */
    onDir(i, d) { if (d === 'up') queued[i] = true; },

    update(dt) {
      // ---- 已經分出勝負：讓輸家倒下去 ----
      if (S.over) {
        S.deadT += dt;
        for (let i = 0; i < 2; i++) {
          if (S.st[i] !== 'dead') continue;
          const o = 1 - i;
          const dir = Math.sign(players[i].group.position.x - players[o].group.position.x) || 1;
          players[i].group.rotation.z = -dir * Math.min(1, S.deadT / 0.5) * 1.45;
        }
      } else {
        for (let i = 0; i < 2; i++) {
          const p = players[i], st = S.st[i];
          S.cool[i] = Math.max(0, S.cool[i] - dt);

          const wantAtk = queued[i] || padPressed(i, 0);
          queued[i] = false;

          if (st === 'hurt') {
            S.t[i] -= dt;
            p.legs[0].rotation.x = p.legs[1].rotation.x = 0;
            if (S.t[i] <= 0) S.st[i] = 'idle';
            continue;
          }

          if (st === 'attack') {
            S.t[i] -= dt;
            const k = 1 - Math.max(0, S.t[i]) / ATK_DUR;               // 0 → 1
            const ext = Math.sin(Math.min(1, k / 0.55) * Math.PI);     // 打出去再收回
            const na = nearArm(i);
            setArm(p, na, lerp(POSE.guard.sh, POSE.punch.sh, ext),
                          lerp(POSE.guard.el, POSE.punch.el, ext));    // 出拳的那隻手
            setArm(p, 1 - na, POSE.guard.sh, POSE.guard.el);           // 另一手留在臉前護著
            p.group.rotation.x = 0.14 * ext;                           // 出拳時身體微前傾
            p.legs[0].rotation.x = 0.16; p.legs[1].rotation.x = -0.16;
            if (!S.hitDone[i] && k > 0.42) {
              S.hitDone[i] = true;
              S.fireCount = S.fireCount || [0, 0]; S.fireCount[i]++;
              hit(i);
            }
            if (S.t[i] <= 0) {
              S.st[i] = 'idle';
              p.group.rotation.x = 0;
              setArm(p, 0, POSE.down.sh, POSE.down.el);
              setArm(p, 1, POSE.down.sh, POSE.down.el);
              p.legs[0].rotation.x = p.legs[1].rotation.x = 0;
            }
            continue;
          }

          // ---- 防禦（按住下）----
          const guarded = HELD[i].down;

          // ---- 攻擊（上）----
          if (S.cool[i] <= 0 && wantAtk) {
            S.st[i] = 'attack'; S.t[i] = ATK_DUR; S.cool[i] = ATK_COOL; S.hitDone[i] = false;
            S.atkCount = S.atkCount || [0, 0]; S.atkCount[i]++;
            blip(255, 0.05, 0.05);
            continue;
          }

          // ---- 移動 ----
          let v = (HELD[i].right ? 1 : 0) - (HELD[i].left ? 1 : 0);
          if (guarded) v *= 0.35;                                       // 防禦時走得慢
          if (v) p.group.position.x = clampX(p.group.position.x + v * SPEED * dt);

          const moving = Math.abs(v) > 0.05;
          p.idle += dt;                    // 戰鬥時大廳邏輯不跑，時間自己累加
          p.walk = moving ? p.walk + dt * 9.5 : p.walk * Math.max(0, 1 - dt * 12);
          const sw = Math.sin(p.walk) * (moving ? 0.55 : 0);
          p.legs[0].rotation.x =  sw; p.legs[1].rotation.x = -sw;
          // 待機呼吸 —— 戰鬥時角色最大、最該有生命感，站著不動也要有起伏
          const br = moving ? 0 : Math.sin(p.idle * 1.7);
          p.torso.scale.y = 1 + br * 0.018;
          p.group.position.y = br * 0.016 + 0.010;
          if (guarded) {                                              // 防禦：前臂抬到臉前
            setArm(p, 0, POSE.guard.sh + br * 0.03, POSE.guard.el);
            setArm(p, 1, POSE.guard.sh - br * 0.03, POSE.guard.el);
          } else {                                                    // 放下（走動時手臂微擺）
            const bob = sw * 0.14 + br * 0.045;
            setArm(p, 0, POSE.down.sh + bob, POSE.down.el);
            setArm(p, 1, POSE.down.sh - bob, POSE.down.el);
          }
        }
      }

      if (!S.over) {
        // ---- 兩人不可互相穿過（沒有的話會直接走過去變成背對背）----
        const x0 = players[0].group.position.x, x1 = players[1].group.position.x;
        const d = x1 - x0;
        if (Math.abs(d) < MIN_SEP) {
          const push = (MIN_SEP - Math.abs(d)) / 2;
          const sg = Math.sign(d) || 1;
          players[0].group.position.x = clampX(x0 - sg * push);
          players[1].group.position.x = clampX(x1 + sg * push);
        }
      }
      // ---- 永遠面對對手 ----
      const p0 = players[0].group.position.x, p1 = players[1].group.position.x;
      players[0].group.rotation.y = (p1 >= p0) ?  Math.PI / 2 : -Math.PI / 2;
      players[1].group.rotation.y = (p0 >= p1) ?  Math.PI / 2 : -Math.PI / 2;

      players.forEach((p) => blinkTick(p, dt));       // 戰鬥中也要眨眼

      // 火花
      for (let i = sparks.length - 1; i >= 0; i--) {
        const sp = sparks[i]; sp.t += dt;
        sp.m.scale.setScalar(1 + sp.t * 5.5);
        sp.m.material.opacity = Math.max(0, 0.95 - sp.t * 4.5);
        if (sp.t > 0.24) { scene.remove(sp.m); sp.m.geometry.dispose(); sp.m.material.dispose(); sparks.splice(i, 1); }
      }
      drawTop();
    },

    // 除錯／測試用：直接設血量
    setHp: (i, v) => { S.hp[i] = Math.max(0, Math.min(MAXHP, v)); drawTop(); return S.hp[i]; },
    // 除錯／測試用：強制結束（指定贏家）
    finish: (winner) => {
      const loser = 1 - winner;
      S.hp[loser] = 0; S.st[loser] = 'dead'; S.over = true; S.winner = winner; S.deadT = 0;
      drawTop();
    },
    // 等倒地動畫播完才進結算畫面
    allDead: () => S.over && S.deadT > 0.75,
    scores: () => [S.hp[0], S.hp[1]],       // 血多的贏
    detail: () => `P1 剩 ${S.hp[0]} HP　｜　P2 剩 ${S.hp[1]} HP`,
    state: () => ({
      hp: S.hp.slice(), st: S.st.slice(), over: S.over, winner: S.winner, deadT: +S.deadT.toFixed(2),
      px: players.map(p => +(p.group.position.x - ARENA_X).toFixed(2)),   // 相對競技場中心
      held: HELD.map(h => ({ l: h.left, r: h.right, u: h.up, d: h.down })),
      cool: S.cool.map(c => +c.toFixed(2)),
      atk: (S.atkCount || [0, 0]).slice(),
      fires: (S.fireCount || [0, 0]).slice(),
    }),
  };
}

/* =========================== OX 移動圈叉 ===========================
   3x3、每人 4 顆。輪到你時可以：
     (a) 指向空格按確認 → 放下新棋子（手上還有才行）
     (b) 指向自己的棋子按確認 → 拿起；再指向空格按確認 → 放下
     ★ 放回同一格 = 拿錯，當作沒動（不消耗這一步、不換手）
     三連線者勝。（規則先用 tools/ox-analyze.js 驗證過：
     4 顆 + 可移到任意空格 = 沒有必勝法也不會偏先攻）
   ====================================================================== */
function createDuelOX() {
  const N = 4, MAX_MOVES = 40;                 // 平均 14.6 步，40 是安全上限
  const LINES = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];

  const S = {
    board: new Array(9).fill(0),   // 0 空 / 1 P1(X) / 2 P2(O)
    hand: [N, N],
    turn: 0,
    cursor: 4,
    held: -1,                      // 拿起的格子索引，-1 = 沒拿
    over: false, winner: -1, moves: 0, overT: 0, winLine: null,
  };
  let popIdx = -1, popT = 0, dropT = 0, msgT = 0;

  // ---------- DOM ----------
  const stage = $('miniStage');
  stage.innerHTML =
    '<div class="oxWrap">' +
      '<div class="oxSide p1" id="oxS1"><div class="nm">P1 紅</div>' +
        '<div class="big" id="oxH1">4</div><div class="lbl" id="oxL1">剩餘棋子</div></div>' +
      '<div class="oxBoardBox">' +
        '<div class="oxHelp">指向自己的棋子＋確認 = 拿起　·　再指向空格＋確認 = 放下　·　放回同一格 = 拿錯取消</div>' +
        '<div class="oxBoard" id="oxBoard"></div>' +
        '<div class="oxHand" id="oxHand"><b class="ar">▼</b><span class="ic">🖐</span></div>' +
        '<div class="oxMsg" id="oxMsg"></div>' +
      '</div>' +
      '<div class="oxSide p2" id="oxS2"><div class="nm">P2 藍</div>' +
        '<div class="big" id="oxH2">4</div><div class="lbl" id="oxL2">剩餘棋子</div></div>' +
    '</div>';

  const boardEl = $('oxBoard'), handEl = $('oxHand'), msgEl = $('oxMsg');
  const s1 = $('oxS1'), s2 = $('oxS2');
  const cells = [];
  for (let i = 0; i < 9; i++) {
    const c = document.createElement('div');
    c.className = 'oxCell';
    boardEl.appendChild(c);
    cells.push(c);
  }

  const glyph = (v) => (v === 1 ? '✕' : v === 2 ? '◯' : '');
  const meOf = () => S.turn + 1;

  // ---------- 畫面 ----------
  function render() {
    for (let i = 0; i < 9; i++) {
      const c = cells[i];
      c.className = 'oxCell' +
        (S.board[i] === 1 ? ' p1' : S.board[i] === 2 ? ' p2' : '') +
        (i === S.cursor ? ' cur' : '') +
        (S.winLine && S.winLine.includes(i) ? ' win' : '');
      if (!c.querySelector('span')) c.appendChild(document.createElement('span'));
      const t = glyph(S.board[i]);
      if (c.firstChild.textContent !== t) c.firstChild.textContent = t;
    }
    // 手的位置：對齊游標那格
    const c = cells[S.cursor];
    handEl.style.left = (c.offsetLeft + c.offsetWidth / 2) + 'px';
    handEl.style.top  = (c.offsetTop + c.offsetHeight / 2) + 'px';
    handEl.classList.toggle('grab', S.held >= 0);

    // 兩側剩餘棋子
    $('oxH1').textContent = String(S.hand[0]);
    $('oxH2').textContent = String(S.hand[1]);
    s1.classList.toggle('turn', !S.over && S.turn === 0);
    s2.classList.toggle('turn', !S.over && S.turn === 1);
    $('oxL1').textContent = S.over ? '' : (S.turn === 0 ? '輪到你' : '等待中');
    $('oxL2').textContent = S.over ? '' : (S.turn === 1 ? '輪到你' : '等待中');

    // 手上有棋子時，把手抓的東西畫出來
    let hold = handEl.querySelector('.hold');
    if (S.held >= 0) {
      if (!hold) { hold = document.createElement('span'); hold.className = 'hold'; handEl.appendChild(hold); }
      hold.textContent = glyph(meOf());
      hold.style.color = S.turn === 0 ? 'var(--p1)' : 'var(--p2)';
    } else if (hold) hold.remove();
  }

  function flash(msg) {
    msgEl.textContent = msg;
    msgEl.classList.add('on');
    msgT = 1.6;
  }

  // ---------- 規則 ----------
  function lineOf() {
    for (const L of LINES) {
      const v = S.board[L[0]];
      if (v && v === S.board[L[1]] && v === S.board[L[2]]) return L;
    }
    return null;
  }

  function endTurn() {
    S.moves++;
    const L = lineOf();
    if (L) { S.over = true; S.winner = S.board[L[0]] - 1; S.winLine = L; S.overT = 0; }
    else if (S.moves >= MAX_MOVES) { S.over = true; S.winner = -1; S.overT = 0; flash('步數用盡 — 和局'); }
    else { S.turn = 1 - S.turn; S.cursor = 4; }     // 換手，游標回中間
  }

  function doConfirm() {
    if (S.over) return;
    const i = S.cursor, me = meOf();

    if (S.held >= 0) {                              // 手上有棋子
      if (i === S.held) {                           // ★ 放回同一格 = 拿錯，當作沒動
        S.board[S.held] = me;                       // 把棋子放回原格
        S.held = -1;
        flash('放回同一格 — 當作沒動');
        render(); return;
      }
      if (S.board[i] !== 0) { flash('那裡有棋子了'); render(); return; }
      S.board[i] = me;                              // 拿起時原格已清空，直接放到新格
      S.held = -1;
      dropT = 0.34; handEl.classList.add('drop');
      popCell(i);
      render(); endTurn(); render(); return;
    }

    if (S.board[i] === me) {                        // 指向自己的棋子 → 拿起
      S.held = i;
      S.board[i] = 0;                               // ★ 拿在手上 → 原格清空（不然看不出拿起來了）
      flash('拿起了 — 再指向空格放下');
      render(); return;
    }
    if (S.board[i] !== 0) { flash('那是對手的棋子'); render(); return; }
    if (S.hand[S.turn] <= 0) { flash('手上的棋子用完了 — 只能搬動場上的'); render(); return; }

    S.board[i] = me;                                // 直接放下新棋子
    S.hand[S.turn]--;
    dropT = 0.34; handEl.classList.add('drop');
    popCell(i);
    render(); endTurn(); render();
  }

  function popCell(i) {
    const c = cells[i];
    c.classList.remove('pop'); void c.offsetWidth; c.classList.add('pop');
    popIdx = i; popT = 0;
  }

  const DIRS = { up: [-1, 0], down: [1, 0], left: [0, -1], right: [0, 1] };
  function doMove(d) {
    if (S.over) return;
    const [dr, dc] = DIRS[d] || [0, 0];
    let r = (S.cursor / 3) | 0, c = S.cursor % 3;
    r = Math.max(0, Math.min(2, r + dr));
    c = Math.max(0, Math.min(2, c + dc));
    S.cursor = r * 3 + c;
    render();
  }

  return {
    mount() { $('mini').classList.add('on'); render(); },
    unmount() { $('mini').classList.remove('on'); stage.innerHTML = ''; },
    onDir(i, d) { if (i === S.turn) doMove(d); },        // 只有當前玩家能動游標
    onConfirm(i) { if (i === S.turn) doConfirm(); },     // 只有當前玩家能按確認
    update(dt) {
      if (popIdx >= 0) { popT += dt; if (popT > 0.4) { cells[popIdx].classList.remove('pop'); popIdx = -1; } }
      if (dropT > 0) { dropT -= dt; if (dropT <= 0) handEl.classList.remove('drop'); }
      if (msgT > 0) { msgT -= dt; if (msgT <= 0) msgEl.classList.remove('on'); }
      if (S.over) { S.overT += dt; render(); }
    },
    allDead: () => S.over && S.overT > 0.9,      // 讓連線打光停留一下再進結算
    scores: () => [S.winner === 0 ? 1 : 0, S.winner === 1 ? 1 : 0],
    detail: () => S.winner === -1
      ? `共 ${S.moves} 步　·　雙方都無法連線`
      : `用 ${S.moves} 步完成三連線　·　${S.winner === 0 ? 'P2 藍' : 'P1 紅'} 手上還剩 ${S.hand[(S.winner + 1) % 2]} 顆`,
    state: () => ({ board: S.board.slice(), hand: S.hand.slice(), turn: S.turn,
                    cursor: S.cursor, held: S.held, over: S.over, winner: S.winner,
                    moves: S.moves, winLine: S.winLine }),
    _set: (patch) => { Object.assign(S, patch); render(); return S; },   // 測試用
  };
}

const MINIGAMES = {
  duel2048:  { label:'2048 對戰',  ready:true,  create: createDuel2048,
               hint:'兩邊同時進行　·　<b>WASD</b>（P1）／<b>方向鍵</b>（P2）　·　盤面死局就結束' },
  duelVolley:{ label:'電氣鼠排球', ready:true,  create: createDuelVolley,
               hint:'<b>A/D</b> 移動　<b>W</b> 跳（P1）　·　<b>←/→</b> 移動　<b>↑</b> 跳（P2）　·　先得 7 分者勝' },
  duelOX:    { label:'移動圈叉',   ready:true,  create: createDuelOX,
               hint:'<b>WASD</b>（P1）／<b>方向鍵</b>（P2）移動游標　·　<b>Space</b>／<b>Enter</b> 確認　·　輪流操作，只有當前玩家能動' },
  duelFight: { label:'橫版對戰',   ready:true,  create: createDuelFight,
               hint:'<b>A/D</b> 移動　<b>W</b> 攻擊　<b>S</b> 防禦（P1）　·　<b>←/→</b> 移動　<b>↑</b> 攻擊　<b>↓</b> 防禦（P2）　·　血量歸零就倒地' },
};

/* =========================== 大廳選單 ===========================
   走過去按確認鍵打開的兩個畫面：
     levels —— 關卡目錄（所有關卡一覽，含施工中的；最後一張是「關閉」）
     stats  —— 戰績詳情（逐關卡勝負 ＋ 玩最多 ＋ 最近玩過）
   刻意做成 DOM 覆蓋層而不是 3D：加關卡只要加一筆資料，
   完全不用碰 3D、不用重算取景、不用煩惱門放哪裡。
   ============================================================== */
let menu = null;                      // null = 沒開；{ kind:'levels'|'stats', sel:int }

const menuEl = $('menu'), menuCard = $('menuCard');
const hx = (c) => '#' + c.toString(16).padStart(6, '0');

/** 關卡的主色（目錄卡片與戰績表共用） */
const gameColor = (id) => GAME_COLORS[id] || 0x9ad8ff;

/** 目錄的卡片清單。遊戲之外的東西（例如動態門）不放進來。 */
const MENU_ORDER = ['duel2048', 'duelVolley', 'duelFight', 'duelOX'];
function menuTiles() {
  const t = [];
  // 第一張固定是「再玩一次」—— 原本這是北牆一道動態門的功能，
  // 改成目錄裡的第一張卡片，不用先走到某道特定的門，反而更好找。
  const last = lastPlayed();
  if (last && MINIGAMES[last]) {
    t.push({ kind:'game', id:last, ready:true, color:gameColor(last),
             label:'🔁 再玩一次：' + MINIGAMES[last].label });
  }
  for (const id of MENU_ORDER) {
    const d = MINIGAMES[id];
    if (!d) continue;
    t.push({ kind: 'game', id, label: d.label, ready: !!d.ready, color: gameColor(id) });
  }
  t.push({ kind: 'close', label: '關閉', color: 0xff9a9a });
  return t;
}

function openMenu(kind) {
  menu = { kind, sel: 0 };
  menuEl.classList.add('on');
  $('hud').style.display = 'none';
  blip(kind === 'levels' ? 660 : 520, 0.09, 0.07);
  menuRender();
}
function closeMenu() {
  menu = null;
  menuEl.classList.remove('on');
  $('hud').style.display = '';
  blip(300, 0.08, 0.05);
}

function menuRender() {
  if (!menu) return;
  const tiles = menuTiles();

  if (menu.kind === 'levels') {
    menu.sel = Math.max(0, Math.min(tiles.length - 1, menu.sel));
    const cards = tiles.map((t, i) => {
      const mc = hx(t.color);
      let st;
      if (t.kind === 'close') st = '回到大廳';
      else {
        const b = rec.byGame[t.id] || { p1: 0, p2: 0, draw: 0 };
        const plays = b.p1 + b.p2 + b.draw;
        st = t.ready
          ? (plays ? `玩過 <b>${plays}</b> 場　·　P1 ${b.p1}　P2 ${b.p2}　平 ${b.draw}`
                   : '還沒玩過')
          : '🔒 施工中';
      }
      return `<div class="mtile${t.kind === 'close' ? ' close' : ''}${i === menu.sel ? ' sel' : ''}${t.ready === false ? ' lock' : ''}"
                   style="--mc:${mc}">
                <div class="nm" style="color:${mc}">${t.label}</div>
                <div class="st">${st}</div>
              </div>`;
    }).join('');
    menuCard.innerHTML =
      `<h2>🎮 關卡目錄</h2><p class="sub">選一個關卡開始　·　共 ${MENU_ORDER.length} 個關卡</p>
       <div class="mgrid">${cards}</div>
       <div class="mft">方向鍵／WASD 選擇　·　確認鍵進入　·　Esc 或選「關閉」返回</div>`;
    return;
  }

  /* ---- 戰績詳情 ---- */
  const rows = MENU_ORDER.filter(id => MINIGAMES[id]).map(id => {
    const b = rec.byGame[id] || { p1: 0, p2: 0, draw: 0 };
    const plays = b.p1 + b.p2 + b.draw;
    return `<tr><td style="color:${hx(gameColor(id))}">${MINIGAMES[id].label}</td>
                <td>${plays}</td><td>${b.p1}</td><td>${b.p2}</td><td>${b.draw}</td></tr>`;
  }).join('');

  const mp = mostPlayed();
  const recent = (rec.recent || []).filter(id => MINIGAMES[id]);
  menuCard.innerHTML =
    `<h2>📊 戰績詳情</h2><p class="sub">總場次 <b>${rec.games || 0}</b>　·　
       平手 <b>${rec.draw || 0}</b>　·　被變身 <b>${rec.pig[0]} : ${rec.pig[1]}</b>（P1 : P2）</p>
     <table class="mt">
       <tr><th>關卡</th><th>場次</th><th>P1 勝</th><th>P2 勝</th><th>平手</th></tr>
       ${rows}
     </table>
     <div class="msec">🏆 玩最多的關卡　<b>${mp ? MINIGAMES[mp.id].label + '（' + mp.n + ' 場）' : '還沒有紀錄'}</b></div>
     <div class="msec">🕘 最近玩過　${recent.length
        ? recent.map((id, i) => `<span class="pill" style="color:${hx(gameColor(id))}">${i + 1}. ${MINIGAMES[id].label}</span>`).join('')
        : '還沒有紀錄'}</div>
     <div class="mft">Esc 或按確認鍵返回大廳</div>`;
}

/** 選單裡的按鍵：兩個玩家都能操作（跟門一樣，誰都可以按） */
const MENU_DIRKEY = [
  { up: 'w', down: 's', left: 'a', right: 'd' },
  { up: 'arrowup', down: 'arrowdown', left: 'arrowleft', right: 'arrowright' },
];
function menuInput() {
  for (let i = 0; i < 2; i++) {
    for (const d of ['up', 'down', 'left', 'right'])
      if (PRESSED[MENU_DIRKEY[i][d]] || padPressed(i, PADB[d])) return d;
    if (PRESSED['space'] || PRESSED['enter'] || padPressed(i, 0)) return 'ok';
    if (PRESSED['escape'] || padPressed(i, 1)) return 'back';
  }
  return null;
}

function menuStep() {
  if (!menu) return;
  const a = menuInput();
  if (!a) return;
  if (a === 'back') { closeMenu(); return; }
  if (a === 'ok') {
    if (menu.kind === 'stats') { closeMenu(); return; }   // 詳情只有一個動作：返回
    const t = menuTiles()[menu.sel];
    if (!t) return;
    if (t.kind === 'close') { closeMenu(); return; }
    if (!t.ready) { blip(170, 0.12, 0.07); return; }      // 施工中 → 拒絕音
    closeMenu();
    startMinigame(t.id);
    return;
  }
  // 方向：3 欄的格子，上下移動一列
  const n = menuTiles().length;
  if (n <= 1) return;
  const cols = 3;
  let s = menu.sel;
  if (a === 'left')  s -= 1;
  if (a === 'right') s += 1;
  if (a === 'up')    s -= cols;
  if (a === 'down')  s += cols;
  const next = Math.max(0, Math.min(n - 1, s));
  if (next !== menu.sel) { menu.sel = next; blip(880, 0.04, 0.04); menuRender(); }
}

/* =========================== 主流程 =========================== */
function startMinigame(id) {
  const def = MINIGAMES[id];
  if (!def || !def.ready) {
    tip(`「${def ? def.label : id}」施工中`, '這個門後面還沒做好——門就是選單，做好直接掛上去', true);
    return;
  }
  currentGameId = id;                            // 戰績要記「哪一關」，存起來給 endMinigame 用
  activeGame = def.create();
  const sceneGame = !!activeGame.ownsScene;      // 3D 小遊戲（戰鬥）要看到場景本身
  $('mini').classList.toggle('scene', sceneGame);
  $('miniStage').style.display = sceneGame ? 'none' : '';
  renderer.domElement.style.filter = sceneGame ? '' : 'blur(3px) brightness(.45)';
  activeGame.mount();
  $('hud').style.display = 'none';          // 大廳說明在 3D 小遊戲裡會穿幫
  currentHint = def.hint || '請用 <b>WASD</b>（P1）／<b>方向鍵</b>（P2）開始';
  $('miniBottom').innerHTML = currentHint;
  phase = PHASE.COUNT; phaseT = 3.2; phaseStart = performance.now();
  audio();  // 使用者手勢後解鎖音效
}

function endMinigame() {
  const s = activeGame.scores();
  const [a, c] = s;
  lastResult = {
    scores: s,
    detail: activeGame.detail ? activeGame.detail() : '',
    winner: a === c ? -1 : (a > c ? 0 : 1),
    gameId: currentGameId,                       // 逐關卡戰績用
  };
  // 先抽好要變哪一種頭 —— 這樣 RESULT 畫面寫的跟真正變的會是同一隻。
  // 抽的時候排除「輸家現在已經戴著的頭」，所以連輸兩場一定看得出換了動物。
  if (lastResult.winner >= 0) {
    const loserIdx = lastResult.winner === 0 ? 1 : 0;
    lastResult.head = randomHead(players[loserIdx].headKind);
  } else {
    lastResult.head = null;                        // 平手：沒人變身
  }
  phase = PHASE.RESULT; phaseT = 0;
}

function backToLobby() {
  if (activeGame) { activeGame.unmount(); activeGame = null; }
  renderer.domElement.style.filter = '';
  $('mini').classList.remove('scene');
  $('miniStage').style.display = '';
  $('hud').style.display = '';
  $('miniBottom').innerHTML = '';

  resetToSpawn();                          // 兩個小人歸回原位
  lobbyLockUntil = performance.now() + 700; // 剛回大廳先關掉門的觸發（避免按著鍵連開）

  if (lastResult) {
    const w = lastResult.winner;
    recordResult(w, lastResult.gameId);   // 記進 localStorage ＋ 更新記分板與動態門
    if (w >= 0) {
      const loser = w === 0 ? 1 : 0;
      setHead(players[w], null);             // ✅ 贏的人立刻變回來
      // 輸的人：每次都要變成「結果畫面公告的那一隻」—— 即使已經是一隻動物也照換。
      // 這裡原本寫成 if (!players[loser].headKind)（已經變身中就維持），
      // 但 endMinigame 早就把公告的頭抽好了 → 變成「公告說恐龍頭、實際還是豬頭」。
      const kind = lastResult.head || randomHead(players[loser].headKind);
      setHead(players[loser], kind);
      if (kind === 'pig') pigSqueal();       // 豬還是有豬叫，其他先只給一個提示音
      else { blip(720, 0.08, 0.09); blip(330, 0.22, 0.08); }
    }
  }
  phase = PHASE.LOBBY; phaseT = 0;
}

/* ---- 門的接近判定與提示 ---- */
const doorTip = $('doorTip');
let nearDoor = null;
let lobbyLockUntil = 0;      // 剛回大廳的緩衝期，期間不觸發門
function checkDoors() {
  if (phase !== PHASE.LOBBY) { doorTip.style.display = 'none'; nearDoor = null; return; }
  let found = null;
  players.forEach((p, i) => {
    if (found) return;
    for (const d of DOORS) {
      if (Math.hypot(p.group.position.x - d.sx, p.group.position.z - d.sz) < 2.0) {
        d.by = i; found = d; break;
      }
    }
  });
  nearDoor = found;
}
function tip(main, sub, warn, color) {
  doorTip.innerHTML = `${main}<div class="sub">${sub || ''}</div>`;
  doorTip.classList.toggle('warn', !!warn);
  if (color) {
    doorTip.style.setProperty('--tipc', '#' + color.toString(16).padStart(6, '0'));
    doorTip.style.setProperty('--tipglow',
      `rgba(${(color >> 16) & 255},${(color >> 8) & 255},${color & 255},.34)`);
  }
  doorTip.style.display = 'block';
}

/* ---- 站點（更衣鏡／重置鈕）的接近判定 ---- */
let nearStation = null, resetArmedUntil = 0, resetFlashUntil = 0;
function checkStations() {
  if (phase !== PHASE.LOBBY) { nearStation = null; return; }
  let found = null;
  players.forEach((p, i) => {
    if (found) return;
    const px = p.group.position.x, pz = p.group.position.z;
    if (Math.hypot(px - MIRROR.x, pz - MIRROR.z) < MIRROR.r)      found = { kind:'mirror', by:i };
    else if (Math.hypot(px - STATS.x,  pz - STATS.z)  < STATS.r)  found = { kind:'stats',  by:i };
    else if (Math.hypot(px - RESETP.x, pz - RESETP.z) < RESETP.r) found = { kind:'reset',  by:i };
  });
  nearStation = found;
}

/* ---- 倒數 ---- */
const countEl = $('count');
const COUNT_SECONDS = 3;
function updateCount(now) {
  // 用「真實時間」而不是被上限截斷的 dt ——
  // 否則分頁被瀏覽器節流時，dt 一直被截在 0.05，倒數會比實際慢幾十倍。
  const remain = COUNT_SECONDS - (now - phaseStart) / 1000;
  if (remain > 0.2) { countEl.textContent = Math.ceil(remain); countEl.classList.add('on'); }
  else { countEl.textContent = 'GO'; countEl.classList.add('on'); }
  if (remain <= 0) {
    countEl.classList.remove('on');
    phase = PHASE.PLAY; phaseT = 0;
    $('miniBottom').innerHTML = currentHint;
  }
}

/* ---- 主迴圈 ---- */
const DIRMAP = { up:'up', down:'down', left:'left', right:'right' };
let last = performance.now(), frames = 0, fpsT = 0, fps = 0;

function frame(now) {
  try {
    frameBody(now);
  } catch (err) {
    frame.errCount = (frame.errCount || 0) + 1;
    errBox.textContent = 'ERROR: ' + ((err && err.message) || err) + '\n' + ((err && err.stack) || '');
    errBox.style.display = 'block';
    if (frame.errCount > 300) return;      // 避免無限洗版
  }
  // 不論上面發生什麼，這兩個一定要執行 —— 否則整個遊戲會「完全不會動」
  outlineTick();                     // 依目前相機補償描邊粗細
  renderer.render(scene, activeCam);
  requestAnimationFrame(frame);
}

function frameBody(now) {
  const dt = Math.min((now - last) / 1000, 0.05);
  last = now;
  frames++; fpsT += dt;
  if (fpsT >= 0.5) { fps = Math.round(frames / fpsT); frames = 0; fpsT = 0; }

  // 3D 小遊戲（戰鬥）自己控制角色 —— 大廳邏輯必須讓開，
  // 否則戰鬥中的角色會被大廳的移動與桌子碰撞拉走。
  const sceneGame = activeGame && activeGame.ownsScene;
  // 選單打開時：小人站著不動，也不判定門／站點（不然會一直被觸發）
  if (phase !== PHASE.COUNT && !sceneGame && !menu) stepLobby(dt);

  // 豬頭計時
  // 變身沒有計時器：要贏一場（或按重置戰績）才會變回來，所以這裡不需要任何處理。

  if (menu) { nearDoor = null; nearStation = null; }
  else { checkDoors(); checkStations(); }

  // 門燈呼吸：靠近的那扇跳得特別明顯
  {
    const tt = now / 1000;
    for (const d of DOORS) {
      const hot = nearDoor === d && phase === PHASE.LOBBY;
      d.lamp.scale.setScalar(hot ? 1.35 + Math.sin(tt * 9) * 0.24 : 1 + Math.sin(tt * 2.0) * 0.06);
    }
    if (RESETP.mesh)
      RESETP.mesh.material.emissiveIntensity =
        performance.now() < resetArmedUntil ? 1.7 + Math.sin(now / 90) * 0.8 : 0.9;
  }

  if (phase === PHASE.LOBBY) {
    const key = (i) => (i === 0 ? 'Space' : 'Enter');

    if (menu) {
      doorTip.style.display = 'none';
      menuStep();                            // 選單開著時，只處理選單的按鍵
    } else if (performance.now() < lobbyLockUntil) {
      doorTip.style.display = 'none';        // 緩衝中：不顯示提示也不觸發
    } else if (nearDoor) {
      if (!nearDoor.ready) {
        tip(`⛔ 「${nearDoor.label}」施工中`, '走到門前按確認，但這個門後面還沒做好', true);
      } else {
        tip(`🚪 ${nearDoor.label}`,
            nearDoor.opensMenu
              ? `P1 按 Space ／ P2 按 Enter ／ 手把 A 開啟　·　共 ${MENU_ORDER.length} 個關卡`
              : 'P1 按 Space ／ P2 按 Enter ／ 手把 A 進入',
            false, nearDoor.color);
        for (let i = 0; i < 2; i++)
          if (PLAYER_CTRL[i].confirm()) {
            if (nearDoor.opensMenu) openMenu(nearDoor.opensMenu);
            else startMinigame(doorTarget(nearDoor));
            break;
          }
      }
    } else if (nearStation) {
      const st = nearStation, i = st.by, nm = PLAYER_CTRL[i].name;

      if (st.kind === 'mirror') {
        const p = players[i];
        if (p.headKind) {
          // 輸掉變成動物期間不准換造型 —— 不然懲罰就被鏡子洗掉了
          tip(`🪞 更衣鏡　（${nm}）`,
              '🚫 變身中不能換造型　·　贏一場才能變回來', true, 0xffb454);
          if (PLAYER_CTRL[i].confirmEdge()) blip(170, 0.12, 0.07);   // 拒絕音
        } else {
          tip(`🪞 更衣鏡　（${nm}）`,
              `按 ${key(i)} 切換造型　·　目前：${BODIES[looks[i]].label}`, false, 0x9ad8ff);
          if (PLAYER_CTRL[i].confirmEdge()) setBody(i, looks[i] + 1);
        }

      } else if (st.kind === 'dir') {
        tip('🎮 關卡目錄', `按 ${key(i)} 開啟　·　目前 ${MENU_ORDER.length} 個關卡`, false, 0x9ad8ff);
        if (PLAYER_CTRL[i].confirmEdge()) openMenu('levels');

      } else if (st.kind === 'stats') {
        tip('📊 戰績詳情', `按 ${key(i)} 開啟　·　總場次 ${rec.games || 0}`, false, 0x9ad8ff);
        if (PLAYER_CTRL[i].confirmEdge()) openMenu('stats');

      } else if (performance.now() < resetFlashUntil) {
        tip('✅ 戰績已重置', '記分板已歸零', false, 0x66dd99);

      } else {
        const armed = performance.now() < resetArmedUntil;
        tip('⚠️ 重置全部戰績',
            armed ? '再按一次確認（3 秒內）' : `按 ${key(i)} 開始　·　會清空記分板上的所有數字`, true);
        if (PLAYER_CTRL[i].confirmEdge()) {
          if (armed) { resetRec(); resetArmedUntil = 0; resetFlashUntil = performance.now() + 1600; blip(300, 0.28, 0.1); }
          else       { resetArmedUntil = performance.now() + 3000; blip(880, 0.1, 0.08); }
        }
      }
    } else doorTip.style.display = 'none';
  }

  if (phase === PHASE.COUNT) updateCount(now);

  if (phase === PHASE.PLAY && activeGame) {
        for (let i = 0; i < 2; i++) {
      const kb = i === 0
        ? { up:'w', down:'s', left:'a', right:'d' }
        : { up:'arrowup', down:'arrowdown', left:'arrowleft', right:'arrowright' };
      const h = HELD[i];
      h.up = !!KEYS[kb.up]; h.down = !!KEYS[kb.down];
      h.left = !!KEYS[kb.left]; h.right = !!KEYS[kb.right];
      const ax = padAxis(i);
      if (ax.x < -0.4) h.left = true;  if (ax.x > 0.4) h.right = true;
      if (ax.z < -0.4) h.up = true;    if (ax.z > 0.4) h.down = true;
      for (const d of ['up', 'down', 'left', 'right']) if (padHeld(i, PADB[d])) h[d] = true;

      // 邊緣觸發（給「一格一動」的遊戲用，例如 2048）
      for (const d of ['up', 'down', 'left', 'right']) {
        if (PRESSED[kb[d]]) { activeGame.onDir(i, d); PRESSED[kb[d]] = false; }
      }
      for (const d of ['up', 'down', 'left', 'right']) {
        if (padPressed(i, PADB[d])) activeGame.onDir(i, d);
      }
      // 確認鍵（邊緣觸發）—— 給需要「選取／放下」的遊戲用，例如移動圈叉。
      // 2048 與排球不需要，所以它們沒有定義 onConfirm，不會受影響。
      if (activeGame.onConfirm && PLAYER_CTRL[i].confirmEdge()) activeGame.onConfirm(i);
    }
    if (activeGame.onHold) activeGame.onHold(HELD);
    if (activeGame.update) activeGame.update(dt);
    if (activeGame.allDead()) endMinigame();
  }

  if (phase === PHASE.RESULT) {
    const s = activeGame ? activeGame.scores() : lastResult.scores;
    const w = s[0] === s[1] ? -1 : (s[0] > s[1] ? 0 : 1);
    const who = w === -1 ? '平手！' : (w === 0 ? 'P1 紅　勝' : 'P2 藍　勝');
    const hd = (lastResult && lastResult.head) ? HEADS[lastResult.head] : null;
    const loserTxt = (w === -1 || !hd) ? '平手，沒有人要變身'
      : `${w === 0 ? 'P2 藍' : 'P1 紅'} 要被變成 ${hd.emoji} ${hd.label}`;
    const detail = (activeGame && activeGame.detail ? activeGame.detail() : null)
                || (lastResult && lastResult.detail) || '';
    $('miniBottom').innerHTML =
      `<span class="big">${who}</span>` + detail +
      `${loserTxt}<br><span style="opacity:.7">按 P1 Space 或 P2 Enter 回到大廳</span>`;
    if (PLAYER_CTRL[0].confirm() || PLAYER_CTRL[1].confirm()) backToLobby();
  }

  for (const k in PRESSED) PRESSED[k] = false;

  probe.textContent = `fps ${fps} | ${phase} | P1(${players[0].group.position.x.toFixed(1)},${players[0].group.position.z.toFixed(1)}) P2(${players[1].group.position.x.toFixed(1)},${players[1].group.position.z.toFixed(1)})`;
}
const probe = $('probe');

addEventListener('resize', () => {
  fitCamera();
  renderer.setSize(innerWidth, innerHeight);
});

renderer.render(scene, activeCam);
requestAnimationFrame(frame);

/* ---- 給自動測試用 ---- */
window.__party = {
  ready:true,
  phase: () => phase,
  enter: (id) => startMinigame(id),
  engine: { gEmpty, gSpawn, gSlideLine, gLines, gMove, gCanMove, gNew, gStep },
  three: THREE.REVISION,
  // --- 除錯用 ---
  press: (k) => { KEYS[k] = true; PRESSED[k] = true; },
  release: (k) => { KEYS[k] = false; },
  forceEnd: () => { if (activeGame) endMinigame(); },
  // --- 大廳新功能 ---
  record: () => JSON.parse(JSON.stringify(rec)),
  resetRecord: () => resetRec(),
  looks: () => looks.slice(),
  setBody: (i, b) => setBody(i, b),
  near: () => (nearStation ? { ...nearStation } : (nearDoor ? { kind:'door', label:nearDoor.label, menu:nearDoor.opensMenu || null, by:nearDoor.by } : null)),
  teleport: (i, x, z) => { players[i].group.position.x = x; players[i].group.position.z = z; },
  bgmOn: () => BGM.on,
  toggleBgm: () => BGM.toggle(),
  footstepTest: () => { unlockAudio(); footstep(0.05, 1); return !!actx; },
  fight: () => (activeGame && activeGame.state ? activeGame.state() : null),
  arms: (i) => {
    const pl = players[i];
    return { shoulder: [+pl.arms[0].rotation.x.toFixed(2), +pl.arms[1].rotation.x.toFixed(2)],
             elbow:    [+pl.arms[0].elbow.rotation.x.toFixed(2), +pl.arms[1].elbow.rotation.x.toFixed(2)],
             gloves:   pl.gloves.map(g => g.visible), lean: +pl.group.rotation.x.toFixed(2) };
  },
  fightSetHp: (i, v) => (activeGame && activeGame.setHp ? activeGame.setHp(i, v) : null),
  ox: () => { const st = activeGame && activeGame.state ? activeGame.state() : null;
              return st && st.board ? st : null; },
  oxMove: (d) => { const st = window.__party.ox(); if (st && activeGame.onDir) activeGame.onDir(st.turn, d); return window.__party.ox(); },
  oxConfirm: () => { const st = window.__party.ox(); if (st && activeGame.onConfirm) activeGame.onConfirm(st.turn); return window.__party.ox(); },
  oxSet: (patch) => (activeGame && activeGame._set ? activeGame._set(patch) && window.__party.ox() : null),
  fightFinish: (w) => (activeGame && activeGame.finish ? activeGame.finish(w) : null),
  camera: () => (activeCam === cam ? 'lobby' : 'fight'),
  // 每道門在畫面裡的 NDC 座標（|x|、|y| 都要 <= 1 才代表完整可見）
  doors: () => DOORS.map((d) => {
    const v = (x, y, z) => { const p = new THREE.Vector3(x, y, z).project(cam);
                             return [+p.x.toFixed(2), +p.y.toFixed(2)]; };
    const half = 1.01 * DOOR_S / 2;
    const sp = d.sign ? d.sign.position : null;
    const base = v(d.x, 0, d.z);
    const top  = sp ? v(sp.x, sp.y + half, sp.z) : v(d.x, 3.4 * DOOR_S, d.z);
    const inside = (q) => Math.abs(q[0]) <= 1 && Math.abs(q[1]) <= 1;
    return { label: d.label, opensMenu: d.opensMenu || null,
             base, top, ok: inside(base) && inside(top) };
  }),
  outline: () => ({ n: OUTLINES.length,
                    scale: OUTLINES.length ? +OUTLINES[0].scale.x.toFixed(4) : null,
                    frustum: +frustum.toFixed(2), ffrustum: +ffrustum.toFixed(2),
                    cam: activeCam === fcam ? 'fight' : 'lobby' }),
  headKeys: () => HEAD_KEYS.slice(),
  // --- 頭部預覽（把一排示範角色擺出來，方便近距離檢查）---
  preview: (kinds, spacing) => {
    for (const o of (window.__prev || [])) scene.remove(o.group);
    window.__prev = [];
    const sp = spacing || 3.0;
    const x0 = -((kinds.length - 1) * sp) / 2;
    kinds.forEach((k, i) => {
      const pl = makeHuman(mix(i % 2), x0 + i * sp, 0);
      pl.group.rotation.y = Math.PI / 4;          // 面向相機
      if (k) setHead(pl, k);
      window.__prev.push(pl);
    });
    return window.__prev.length;
  },
  clearPreview: () => { for (const o of (window.__prev || [])) scene.remove(o.group); window.__prev = []; },
  setFrustum: (f) => {
    frustum = f;
    const a = innerWidth / innerHeight;
    cam.left = -frustum * a / 2; cam.right = frustum * a / 2;
    cam.top = frustum / 2; cam.bottom = -frustum / 2;
    cam.updateProjectionMatrix();
    return frustum;
  },
  setHead: (i, k) => setHead(players[i], k),
  headHex: (i) => {
    const pl = players[i], h = pl.headParts.find(m => m.material && m.material.color);
    return { kind: pl.headKind, parts: pl.headParts.length, hair: pl.hairParts.map(x => x.visible),
             skull: pl.skull.visible, skullColor: '#' + pl.headMat.color.getHexString() };
  },
  pigDebug: () => players.map((pl, i) => ({
    who: i === 0 ? 'P1' : 'P2',
    headKind: pl.headKind,
    hairVisible: pl.hairParts.map(h => h.visible),
    hairCount: pl.hairParts.length,
    headColor: '#' + pl.headMat.color.getHexString(),
    headParts: pl.headParts.length,
    children: pl.head.children.length,
  })),
  gameDebug: () => {
    if (!activeGame || !activeGame.refs) return null;
    const { ball, P } = activeGame.refs;
    return { ball: { x: Math.round(ball.x), y: Math.round(ball.y), vx: Math.round(ball.vx), vy: Math.round(ball.vy), live: ball.live },
             px: P.map(p => Math.round(p.x)),
             py: P.map(p => Math.round(p.y)) };
  },
  lobby: () => ({ phase, head: players.map(p => p.headKind), lastResult }),
  menu: () => (menu ? { kind: menu.kind, sel: menu.sel, tiles: menuTiles().length,
                        shown: menuEl.classList.contains('on') } : null),
  openMenu: (k) => { openMenu(k); return window.__party.menu(); },
  menuMove: (d) => { if (!menu) return null; PRESSED[MENU_DIRKEY[0][d]] = true;
                     menuStep(); return window.__party.menu(); },
  menuOk: () => { if (!menu) return null; PRESSED['space'] = true; menuStep();
                  return { menu: window.__party.menu(), phase,
                           card: menuCard.textContent.replace(/\s+/g, ' ').slice(0, 400) }; },
  menuText: () => menuCard.textContent.replace(/\s+/g, ' ').slice(0, 900),
  recData: () => JSON.parse(JSON.stringify(rec)),
  stations: () => ({ stats: { x: STATS.x, z: STATS.z, r: STATS.r },
                     reset: { x: RESETP.x, z: RESETP.z, r: RESETP.r } }),
  debug: () => ({
    phase,
    keys: Object.keys(KEYS).filter(k => KEYS[k]),
    pressed: Object.keys(PRESSED).filter(k => PRESSED[k]),
    hasGame: !!activeGame,
    grids: activeGame ? activeGame.state.map(s => s.game.grid) : null,
    scores: activeGame ? activeGame.state.map(s => s.game.score) : null,
    tiles: activeGame ? activeGame.state.map(s => [...s.tiles.values()].map(t => `${t.val}@${t.idx}`)) : null,
    dead: activeGame ? activeGame.state.map(s => s.dead) : null,
  }),
};
</script>
</body>
